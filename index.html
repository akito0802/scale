<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef3f8">
<title>NEET NOTE スケール辞典</title>
<style>
:root{--bg:#eef3f8;--panel:#fff;--panel2:#f7fafc;--ink:#172033;--muted:#64748b;--line:#d8e1eb;--accent:#6d5bd0;--accent2:#ece9ff;--root:#ef476f;--feature:#f59e0b;--shadow:0 10px 28px rgba(30,41,59,.08)}
[data-theme="dark"]{--bg:#111827;--panel:#1b2433;--panel2:#121a27;--ink:#f3f6fb;--muted:#a8b3c5;--line:#334155;--accent:#a99cff;--accent2:#2d2752;--root:#ff7897;--feature:#fbbf24;--shadow:0 12px 34px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;transition:.2s}.shell{max-width:920px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}.title{flex:1}.title p{margin:0;color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.1em}.title h1{margin:2px 0 0;font-size:1.65rem}button,select{font:inherit}.icon-btn,.menu-close{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer}.theme-top{padding:0 14px;width:auto;font-weight:800}.menu-overlay{position:fixed;inset:0;z-index:98;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s}.menu-overlay.open{opacity:1;pointer-events:auto}.side-menu{position:fixed;inset:0 auto 0 0;z-index:99;width:min(84vw,310px);padding:22px 18px;background:var(--panel);transform:translateX(-105%);transition:.22s;box-shadow:20px 0 40px rgba(0,0,0,.22)}.side-menu.open{transform:none}.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.side-head h2{margin:0}.menu-link,.theme-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;margin:7px 0;border:0;border-radius:12px;background:transparent;color:var(--ink);text-decoration:none;font-weight:800;text-align:left}.menu-link:hover,.menu-link.current,.theme-toggle:hover{background:var(--accent2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}.card h2{margin:0 0 14px;font-size:1.15rem}.filters{padding:20px}.filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.filter-grid select,.compare-select select,#tempo{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:0 12px}.hero-head{display:flex;gap:12px;align-items:flex-start}.hero-head>div{flex:1}.eyebrow{margin:0;color:var(--accent);font-size:.75rem;font-weight:900;letter-spacing:.1em}.hero h2{margin:4px 0;font-size:1.8rem}.subtitle{margin:0;color:var(--muted)}.fav{height:40px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--ink);padding:0 14px;font-weight:800}.fav.on{background:#fff4cc;color:#7c5600}.note-row,.degree-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px;margin-top:16px}.note,.degree{height:48px;display:grid;place-items:center;border-radius:12px}.note{background:var(--panel2);border:1px solid var(--line);font-weight:900}.note.root{background:var(--root);border-color:var(--root);color:#fff}.note.feature{outline:3px solid color-mix(in srgb,var(--feature) 55%,transparent)}.degree{height:24px;color:var(--muted);font-size:.82rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{min-height:42px;border:0;border-radius:12px;padding:0 14px;background:var(--accent);color:#fff;font-weight:850;cursor:pointer}.btn.sub{background:var(--accent2);color:var(--ink)}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.info{min-height:132px;padding:16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.info b{display:block;margin-bottom:8px;font-size:.95rem}.info p{margin:0;color:var(--muted);line-height:1.65;font-size:.95rem}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.compare-panel{min-height:150px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px}.compare-panel h3{margin:0 0 8px;font-size:1rem}.compare-panel p{line-height:1.8}.compare-panel small{color:var(--muted)}.diff{color:var(--feature);font-weight:900}.section-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.section-grid .card{margin:0;min-height:260px}.history-list{display:grid;gap:8px}.mini{min-height:64px;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:11px 12px;text-align:left;cursor:pointer}.mini b{display:block}.mini span{color:var(--muted);font-size:.82rem}.empty{color:var(--muted)}
@media(max-width:760px){.shell{padding:12px}.title h1{font-size:1.35rem}.theme-top{width:42px;font-size:0}.theme-top::before{content:'◐';font-size:1rem}.filter-grid,.info-grid,.compare-grid,.section-grid{grid-template-columns:1fr}.card{padding:16px}.info{min-height:0}.section-grid .card{min-height:0}.hero-head{align-items:center}.hero h2{font-size:1.5rem}}
</style>
</head>
<body>
<div id="menuOverlay" class="menu-overlay"></div>
<nav id="sideMenu" class="side-menu" aria-hidden="true">
<div class="side-head"><h2>NEET NOTE</h2><button id="menuClose" class="menu-close">×</button></div>
<a class="menu-link" href="https://akito0802.github.io/NEET-note/">📝 ノート</a><a class="menu-link current" href="./">🎸 スケール</a><a class="menu-link" href="https://akito0802.github.io/-h/">🎵 指板</a><a class="menu-link" href="https://akito0802.github.io/Cordhyo-/index.html">📚 コード</a><a class="menu-link" href="https://akito0802.github.io/NEET-note/tools.html">🧰 ツール</a><button id="themeMenu" class="theme-toggle">🌙 ダークモード</button>
</nav>
<div class="shell">
<header class="topbar"><button id="menuOpen" class="icon-btn">☰</button><div class="title"><p>NEET NOTE MUSIC THEORY</p><h1>スケール辞典</h1></div><button id="themeTop" class="icon-btn theme-top">🌙 ダーク</button></header>
<section class="card filters"><div class="filter-grid"><select id="keySelect"></select><select id="groupSelect"></select><select id="scaleSelect"></select></div></section>
<section class="card hero"><div class="hero-head"><div><p class="eyebrow" id="groupLabel"></p><h2 id="scaleTitle">読み込み中...</h2><p class="subtitle" id="scaleSubtitle"></p></div><button id="favBtn" class="fav">☆ お気に入り</button></div><div id="notes" class="note-row"></div><div id="degrees" class="degree-row"></div><div class="actions"><button class="btn" data-play="up">▶ 上昇</button><button class="btn sub" data-play="down">▶ 下降</button><button class="btn sub" data-play="both">▶ 上昇・下降</button><button class="btn sub" data-play="random">▶ ランダム</button><select id="tempo"><option value="500">ゆっくり</option><option value="320" selected>普通</option><option value="190">速い</option></select></div><div class="info-grid"><div class="info"><b>特徴</b><p id="description"></p></div><div class="info"><b>特徴音</b><p id="featureText"></p></div><div class="info"><b>対応コード</b><p id="chordText"></p></div><div class="info"><b>親スケール</b><p id="parentText"></p></div><div class="info"><b>向いているジャンル</b><p id="genreText"></p></div><div class="info"><b>音楽的アプローチ</b><p id="tipText"></p></div></div></section>
<section class="card"><h2>比較モード</h2><div class="compare-select"><select id="compareScale"></select></div><div id="compareGrid" class="compare-grid"></div></section>
<div class="section-grid"><section class="card"><h2>お気に入り</h2><div id="favorites" class="history-list"></div></section><section class="card"><h2>最近見たスケール</h2><div id="history" class="history-list"></div></section></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data={},current=null,flat=[];const LS_THEME='neet-note-theme',LS_FAV='scale-favorites-v2',LS_HIST='scale-history-v2';const norm=s=>String(s||'').toLowerCase();
function infer(name,desc){const t=norm(name+' '+desc),m=[],g=[];if(/major|メジャー|ionian/.test(t))m.push('明るい');if(/minor|マイナー|aeolian/.test(t))m.push('切ない');if(/dimin|altered|locrian|オルタード/.test(t))m.push('不穏');if(/whole|lydian|リディアン/.test(t))m.push('幻想的');if(/japanese|都節|平調子|ヨナ抜き|琉球/.test(t))m.push('和風');if(/dorian|mixolydian|ドリアン|ミクソ/.test(t))m.push('おしゃれ');if(/phrygian|harmonic|フリジアン/.test(t))m.push('激しい');if(/pentatonic|ペンタ/.test(t))g.push('ロック','ポップス');if(/blues|ブルース/.test(t))g.push('ブルース','ロック');if(/jazz|bebop|altered|lydian dominant|ジャズ/.test(t))g.push('ジャズ');if(/phrygian|harmonic minor/.test(t))g.push('メタル');if(/japanese|arab|spanish|gypsy|都節|琉球/.test(t))g.push('民族音楽','ゲーム音楽');if(!g.length)g.push('ポップス');return{moods:[...new Set(m)],genres:[...new Set(g)]}}
function flatten(){flat=[];Object.entries(data).forEach(([key,groups])=>Object.entries(groups).forEach(([group,scales])=>Object.entries(scales).forEach(([name,arr])=>{const desc=arr?.[0]?.description||'';flat.push({key,group,name,arr,desc,...infer(name,desc)})})))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function options(el,arr){el.innerHTML=arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function theme(v){document.documentElement.dataset.theme=v;localStorage.setItem(LS_THEME,v);const d=v==='dark';$('#themeTop').textContent=d?'☀️ ライト':'🌙 ダーク';$('#themeMenu').textContent=d?'☀️ ライトモード':'🌙 ダークモード';document.querySelector('meta[name=theme-color]').content=d?'#111827':'#eef3f8'}function setupMenu(){const m=$('#sideMenu'),o=$('#menuOverlay');$('#menuOpen').onclick=()=>{m.classList.add('open');o.classList.add('open')};const close=()=>{m.classList.remove('open');o.classList.remove('open')};$('#menuClose').onclick=close;o.onclick=close;$('#themeTop').onclick=$('#themeMenu').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');theme(localStorage.getItem(LS_THEME)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}
function bindKey(){const k=$('#keySelect').value;options($('#groupSelect'),Object.keys(data[k]||{}));bindGroup()}function bindGroup(){const k=$('#keySelect').value,g=$('#groupSelect').value;options($('#scaleSelect'),Object.keys(data[k]?.[g]||{}));showSelected()}function currentObj(){return flat.find(x=>x.key===$('#keySelect').value&&x.group===$('#groupSelect').value&&x.name===$('#scaleSelect').value)}function go(x){$('#keySelect').value=x.key;bindKey();$('#groupSelect').value=x.group;bindGroup();$('#scaleSelect').value=x.name;showSelected();scrollTo({top:0,behavior:'smooth'})}
function chordsFor(x){const n=norm(x.name);if(/altered|オルタード/.test(n))return`${x.key}7alt、${x.key}7♭9、${x.key}7♯9`;if(/dorian|ドリアン/.test(n))return`${x.key}m7、${x.key}m6`;if(/mixolydian|ミクソ/.test(n))return`${x.key}7、${x.key}9`;if(/lydian|リディアン/.test(n))return`${x.key}maj7(#11)`;if(/minor|マイナー/.test(n))return`${x.key}m、${x.key}m7`;if(/blues|ブルース/.test(n))return`${x.key}7、${x.key}ブルース進行`;return`${x.key}、${x.key}maj7、${x.key}6`}
function parentFor(x){const n=norm(x.name),map=[['dorian','メジャースケールの第2モード'],['phrygian','メジャースケールの第3モード'],['lydian','メジャースケールの第4モード'],['mixolydian','メジャースケールの第5モード'],['aeolian','メジャースケールの第6モード'],['locrian','メジャースケールの第7モード']],h=map.find(([k])=>n.includes(k));return h?h[1]:'同主調・平行調と比較すると理解しやすい。'}
function approachFor(x){const n=norm(x.name),key=x.key;if(/altered|オルタード/.test(n))return`${key}7系コード上で♭9・♯9・♭13を緊張音として使い、半音で次のコードのコードトーンへ解決すると効果的。`;if(/dorian|ドリアン/.test(n))return`${key}m7を中心に6度の音を長めに響かせる。マイナーの暗さを保ちながら、浮遊感のあるファンクやジャズのフレーズを作りやすい。`;if(/phrygian|フリジアン/.test(n))return`ルート直上の♭2を短く強調し、ルートへ半音解決させる。低音のペダルと組み合わせると、緊張感や異国的な響きが出る。`;if(/lydian|リディアン/.test(n))return`${key}maj7上で♯4を伸ばし、3度や5度へ滑らかにつなぐ。明るさを保ったまま浮遊感を作れる。`;if(/mixolydian|ミクソ/.test(n))return`${key}7上で♭7を軸にし、メジャー3度との対比を作る。ブルース、ロック、ファンクの反復フレーズに向く。`;if(/locrian|ロクリアン/.test(n))return`♭2と♭5を短い経過音として使い、ルートや♭3へ解決する。長く停滞させず、緊張感を作る場面で使うとまとまりやすい。`;if(/harmonic|ハーモニック/.test(n))return`増2度の跳躍と導音からルートへの解決を意識する。マイナーのドミナント進行上で使うと劇的な響きになる。`;if(/melodic|メロディック/.test(n))return`上行では6度と7度を明るく扱い、コードトーンを着地点にする。ジャズでは各モードの対応コードに合わせて特徴音を狙う。`;if(/pentatonic|ペンタ/.test(n))return`音数を絞り、短いモチーフを反復してリズムを変化させる。チョーキングやスライドを加えると歌うようなフレーズになる。`;if(/blues|ブルース/.test(n))return`ブルーノートを長く止めず、半音上または下の安定音へ解決する。チョーキング、ハンマリング、休符を組み合わせると表情が出る。`;if(/whole|ホールトーン/.test(n))return`全音間隔の対称性を活かし、同じ形を全音ずつ移動させる。オーギュメント系コードやドミナント上で曖昧な浮遊感を作れる。`;if(/dimin|ディミニッシュ/.test(n))return`短3度ごとの同型フレーズを移動させ、ドミナントコード上の緊張感を作る。最後は半音でコードトーンへ解決する。`;if(x.moods.includes('和風'))return`主音を長く保ち、音数と装飾を絞って間を作る。2音または3音の短い動機を反復し、余韻を残すと和風の響きが明確になる。`;if(x.genres.includes('ジャズ'))return`コードトーンを強拍の着地点に置き、特徴音は弱拍や経過音として使う。フレーズの最後を3度または7度へ解決すると自然。`;if(x.genres.includes('ロック'))return`ルートと5度を軸に短いモチーフを作り、リズムと休符を変えて展開する。特徴音はフレーズの山場で強調すると使いやすい。`;if(/minor|マイナー|aeolian/.test(n))return`${key}m系コード上で♭3・♭6・♭7を意識し、ルートまたは5度へ着地する。下降フレーズを多めにすると哀愁が出やすい。`;if(/major|メジャー|ionian/.test(n))return`${key}maj系コード上で1・3・5度を着地点にし、2・6度を経過音として使う。順次進行と跳躍を混ぜると明るく自然な旋律になる。`;return`ルートを基準に構成音を短いモチーフへまとめ、特徴音を一度強調したあとコードトーンへ解決する。上昇・下降の両方を試し、響きの個性を確認しよう。`}
function showSelected(){current=currentObj();if(!current)return;const n=current.arr.map(x=>x.name||''),d=current.arr.map(x=>x.degree||''),f=Math.max(1,n.length>4?3:1);$('#groupLabel').textContent=current.group;$('#scaleTitle').textContent=`${current.key} ${current.name}`;$('#scaleSubtitle').textContent=current.moods.concat(current.genres).slice(0,4).join('・');$('#notes').innerHTML=n.map((x,i)=>`<div class="note ${i===0?'root':''} ${i===f?'feature':''}">${esc(x)}</div>`).join('');$('#degrees').innerHTML=d.map(x=>`<div class="degree">${esc(x)}</div>`).join('');$('#description').textContent=current.desc||'構成音を鳴らしながら、このスケールの響きを確認しよう。';$('#featureText').textContent=n[f]?`${n[f]}（${d[f]||'特徴音'}）を意識すると個性が出やすい。`:'ルート音との距離感を意識しよう。';$('#chordText').textContent=chordsFor(current);$('#parentText').textContent=parentFor(current);$('#genreText').textContent=current.genres.join('・')||'幅広いジャンル';$('#tipText').textContent=approachFor(current)||'ルートとコードトーンを着地点にし、特徴音を経過音として使おう。';updateFav();fillCompare();addHistory();renderSide()}
function id(x){return`${x.key}|${x.group}|${x.name}`}function store(k,v){localStorage.setItem(k,JSON.stringify(v))}function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}function byId(v){return flat.find(x=>id(x)===v)}function toggleFav(){let a=load(LS_FAV),v=id(current);a=a.includes(v)?a.filter(x=>x!==v):[v,...a].slice(0,30);store(LS_FAV,a);updateFav();renderSide()}function updateFav(){const on=load(LS_FAV).includes(id(current));$('#favBtn').classList.toggle('on',on);$('#favBtn').textContent=on?'★ お気に入り済み':'☆ お気に入り'}function addHistory(){let a=load(LS_HIST).filter(x=>x!==id(current));a.unshift(id(current));store(LS_HIST,a.slice(0,10))}function renderList(el,arr){el.innerHTML=arr.map(byId).filter(Boolean).map(x=>`<button class="mini" data-open="${esc(id(x))}"><b>${esc(x.key)} ${esc(x.name)}</b><span>${esc(x.group)}</span></button>`).join('')||'<p class="empty">まだありません</p>';el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(byId(b.dataset.open)))}function renderSide(){renderList($('#favorites'),load(LS_FAV));renderList($('#history'),load(LS_HIST))}
const chrom=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],alias={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};function pc(n){return chrom.indexOf(alias[n]||n.replace(/[^A-G#b]/g,''))}function midi(n,oct=4){return 12*(oct+1)+pc(n)}function play(mode){const ns=current.arr.map(x=>x.name).filter(Boolean),seq=mode==='down'?[...ns].reverse():mode==='both'?[...ns,...ns.slice(0,-1).reverse()]:mode==='random'?[...ns].sort(()=>Math.random()-.5):ns,ctx=new(AudioContext||webkitAudioContext)(),gap=+$('#tempo').value;seq.forEach((n,i)=>setTimeout(()=>{const o=ctx.createOscillator(),g=ctx.createGain(),f=440*Math.pow(2,(midi(n)-69)/12);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.42);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.45)},i*gap))}
function fillCompare(){const same=flat.filter(x=>x.key===current.key&&id(x)!==id(current));options($('#compareScale'),same.map(id));renderCompare()}function renderCompare(){const b=byId($('#compareScale').value)||flat.find(x=>x.key===current.key&&id(x)!==id(current));if(!b)return;const as=new Set(current.arr.map(x=>pc(x.name))),bs=new Set(b.arr.map(x=>pc(x.name))),panel=(x,other)=>`<div class="compare-panel"><h3>${esc(x.key)} ${esc(x.name)}</h3><p>${x.arr.map(n=>`<span class="${other.has(pc(n.name))?'':'diff'}">${esc(n.name)}</span>`).join(' · ')}</p><small>${esc(x.desc||'')}</small></div>`;$('#compareGrid').innerHTML=panel(current,bs)+panel(b,as)}
function init(){options($('#keySelect'),Object.keys(data));bindKey();$('#keySelect').onchange=bindKey;$('#groupSelect').onchange=bindGroup;$('#scaleSelect').onchange=showSelected;$('#compareScale').onchange=renderCompare;$('#favBtn').onclick=toggleFav;$$('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));showSelected()}
setupMenu();fetch('scales.json').then(r=>r.json()).then(d=>{data=d;flatten();init()}).catch(()=>{$('#scaleTitle').textContent='データを読み込めませんでした'});
</script>
</body></html>
