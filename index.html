<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef3f8">
<title>NEET NOTE スケール辞典</title>
<style>
:root{--bg:#eef3f8;--panel:#fff;--panel2:#f7fafc;--ink:#172033;--muted:#64748b;--line:#d8e1eb;--accent:#6d5bd0;--accent2:#ece9ff;--root:#ef476f;--feature:#f59e0b;--shadow:0 12px 32px rgba(30,41,59,.09)}
[data-theme="dark"]{--bg:#111827;--panel:#1b2433;--panel2:#121a27;--ink:#f3f6fb;--muted:#a8b3c5;--line:#334155;--accent:#a99cff;--accent2:#2d2752;--root:#ff7897;--feature:#fbbf24;--shadow:0 12px 34px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;transition:.2s}.shell{max-width:1180px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}.title{flex:1}.title p{margin:0;color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.12em}.title h1{margin:2px 0 0;font-size:clamp(1.35rem,3vw,2rem)}button,select,input{font:inherit}.icon-btn,.menu-close{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--ink);cursor:pointer}.theme-top{padding:0 14px;width:auto;font-weight:800}.menu-overlay{position:fixed;inset:0;z-index:98;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s}.menu-overlay.open{opacity:1;pointer-events:auto}.side-menu{position:fixed;inset:0 auto 0 0;z-index:99;width:min(84vw,310px);padding:22px 18px;background:var(--panel);transform:translateX(-105%);transition:.22s;box-shadow:20px 0 40px rgba(0,0,0,.22)}.side-menu.open{transform:none}.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.side-head h2{margin:0}.menu-link,.theme-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;margin:7px 0;border:0;border-radius:12px;background:transparent;color:var(--ink);text-decoration:none;font-weight:800;text-align:left}.menu-link:hover,.menu-link.current,.theme-toggle:hover{background:var(--accent2)}.filters,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.filters{padding:16px;margin-bottom:16px}.search{display:flex;gap:10px;flex-wrap:wrap}.search input{flex:1;min-width:220px}.search input,.filter-grid select,.compare-select select{border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:11px 12px}.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 2px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--ink);padding:8px 12px;cursor:pointer}.chip.active{background:var(--accent);color:white;border-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);gap:16px}.card{padding:18px;margin-bottom:16px}.hero-head{display:flex;gap:12px;align-items:flex-start}.hero-head>div{flex:1}.eyebrow{margin:0;color:var(--accent);font-size:.75rem;font-weight:900;letter-spacing:.1em}.hero h2{margin:4px 0 4px;font-size:clamp(1.5rem,4vw,2.35rem)}.subtitle{margin:0;color:var(--muted)}.fav{border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--ink);padding:9px 13px;font-weight:800}.fav.on{background:#fff4cc;color:#7c5600}.note-row,.degree-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.note{min-width:48px;padding:12px 10px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);text-align:center;font-weight:900}.note.root{background:var(--root);border-color:var(--root);color:white}.note.feature{outline:3px solid color-mix(in srgb,var(--feature) 55%,transparent)}.degree{min-width:48px;text-align:center;color:var(--muted);font-size:.82rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:white;font-weight:850;cursor:pointer}.btn.sub{background:var(--accent2);color:var(--ink)}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.info{padding:13px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.info b{display:block;margin-bottom:5px}.info p{margin:0;color:var(--muted);line-height:1.65}.fret-wrap{overflow:auto}.fretboard{min-width:720px;display:grid;grid-template-columns:42px repeat(13,1fr);gap:3px;background:#6b4b2a;padding:8px;border-radius:14px}.fret-label{color:#fff;text-align:center;font-size:.72rem;padding:4px}.string-label{color:#fff;font-weight:800;display:grid;place-items:center}.fret{height:34px;background:#d9b27c;border-right:2px solid #b58b58;display:grid;place-items:center;position:relative}.dot{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:.68rem;font-weight:900;background:#fff;color:#172033}.dot.root{background:var(--root);color:#fff}.dot.feature{box-shadow:0 0 0 3px var(--feature)}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare-panel{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px}.compare-panel h3{margin:0 0 8px}.diff{color:var(--feature);font-weight:900}.history-list,.result-list{display:grid;gap:8px}.mini{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:11px;cursor:pointer}.mini b{display:block}.mini span{color:var(--muted);font-size:.82rem}.empty{color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}.filter-grid{grid-template-columns:1fr}.info-grid,.compare-grid{grid-template-columns:1fr}.theme-top{width:42px;font-size:0}.theme-top::before{content:'◐';font-size:1rem}}
</style>
</head>
<body>
<div id="menuOverlay" class="menu-overlay"></div>
<nav id="sideMenu" class="side-menu" aria-hidden="true">
<div class="side-head"><h2>NEET NOTE</h2><button id="menuClose" class="menu-close">×</button></div>
<a class="menu-link" href="https://akito0802.github.io/NEET-note/">📝 ノート</a>
<a class="menu-link current" href="./">🎸 スケール</a>
<a class="menu-link" href="https://akito0802.github.io/-h/">🎵 指板</a>
<a class="menu-link" href="https://akito0802.github.io/Cordhyo-/index.html">📚 コード</a>
<a class="menu-link" href="https://akito0802.github.io/NEET-note/tools.html">🧰 ツール</a>
<button id="themeMenu" class="theme-toggle">🌙 ダークモード</button>
</nav>
<div class="shell">
<header class="topbar"><button id="menuOpen" class="icon-btn">☰</button><div class="title"><p>NEET NOTE MUSIC THEORY</p><h1>スケール辞典</h1></div><button id="themeTop" class="icon-btn theme-top">🌙 ダーク</button></header>
<section class="filters">
<div class="search"><input id="searchInput" placeholder="スケール名・雰囲気・ジャンルで検索"><button id="clearSearch" class="btn sub">クリア</button></div>
<div class="filter-grid"><select id="keySelect"></select><select id="groupSelect"></select><select id="scaleSelect"></select></div>
<div id="moodChips" class="chips"></div><div id="genreChips" class="chips"></div>
</section>
<div class="layout"><main>
<section class="card hero"><div class="hero-head"><div><p class="eyebrow" id="groupLabel"></p><h2 id="scaleTitle">読み込み中...</h2><p class="subtitle" id="scaleSubtitle"></p></div><button id="favBtn" class="fav">☆ お気に入り</button></div><div id="notes" class="note-row"></div><div id="degrees" class="degree-row"></div><div class="actions"><button class="btn" data-play="up">▶ 上昇</button><button class="btn sub" data-play="down">▶ 下降</button><button class="btn sub" data-play="both">▶ 上昇・下降</button><button class="btn sub" data-play="random">▶ ランダム</button><select id="tempo"><option value="500">ゆっくり</option><option value="320" selected>普通</option><option value="190">速い</option></select></div><div class="info-grid"><div class="info"><b>特徴</b><p id="description"></p></div><div class="info"><b>特徴音</b><p id="featureText"></p></div><div class="info"><b>対応コード</b><p id="chordText"></p></div><div class="info"><b>親スケール</b><p id="parentText"></p></div><div class="info"><b>向いているジャンル</b><p id="genreText"></p></div><div class="info"><b>使い方のヒント</b><p id="tipText"></p></div></div></section>
<section class="card"><h2>指板表示</h2><div class="actions"><select id="instrument"><option value="guitar">ギター</option><option value="bass">ベース</option><option value="ukulele">ウクレレ</option></select><a id="openFret" class="btn sub" href="https://akito0802.github.io/-h/">詳しく見る</a></div><div class="fret-wrap"><div id="fretboard" class="fretboard"></div></div></section>
<section class="card"><h2>比較モード</h2><div class="compare-select"><select id="compareScale"></select></div><div id="compareGrid" class="compare-grid"></div></section>
</main><aside>
<section class="card"><h2>検索結果</h2><div id="searchResults" class="result-list empty">検索すると候補が表示されるよ</div></section>
<section class="card"><h2>お気に入り</h2><div id="favorites" class="history-list"></div></section>
<section class="card"><h2>最近見たスケール</h2><div id="history" class="history-list"></div></section>
</aside></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data={},current=null,flat=[];const LS_THEME='neet-note-theme',LS_FAV='scale-favorites-v2',LS_HIST='scale-history-v2';
const tags={moods:['明るい','切ない','不穏','幻想的','和風','おしゃれ','激しい'],genres:['ポップス','ロック','ブルース','ジャズ','メタル','民族音楽','ゲーム音楽']};
const norm=s=>String(s||'').toLowerCase();
function infer(name,desc){const t=norm(name+' '+desc);let moods=[],genres=[];if(/major|メジャー|ionian/.test(t))moods.push('明るい');if(/minor|マイナー|aeolian/.test(t))moods.push('切ない');if(/dimin|altered|locrian|オルタード/.test(t))moods.push('不穏');if(/whole|lydian|リディアン/.test(t))moods.push('幻想的');if(/japanese|都節|平調子|ヨナ抜き|琉球/.test(t))moods.push('和風');if(/dorian|mixolydian|ドリアン|ミクソ/.test(t))moods.push('おしゃれ');if(/phrygian|harmonic|フリジアン/.test(t))moods.push('激しい');if(/pentatonic|ペンタ/.test(t))genres.push('ロック','ポップス');if(/blues|ブルース/.test(t))genres.push('ブルース','ロック');if(/jazz|bebop|altered|lydian dominant|ジャズ/.test(t))genres.push('ジャズ');if(/phrygian|harmonic minor/.test(t))genres.push('メタル');if(/japanese|arab|spanish|gypsy|都節|琉球/.test(t))genres.push('民族音楽','ゲーム音楽');if(!genres.length)genres.push('ポップス');return{moods:[...new Set(moods)],genres:[...new Set(genres)]}}
function flatten(){flat=[];Object.entries(data).forEach(([key,groups])=>Object.entries(groups).forEach(([group,scales])=>Object.entries(scales).forEach(([name,arr])=>{const desc=arr?.[0]?.description||'';flat.push({key,group,name,arr,desc,...infer(name,desc)})})))}
function theme(v){document.documentElement.dataset.theme=v;localStorage.setItem(LS_THEME,v);const dark=v==='dark';$('#themeTop').textContent=dark?'☀️ ライト':'🌙 ダーク';$('#themeMenu').textContent=dark?'☀️ ライトモード':'🌙 ダークモード';document.querySelector('meta[name=theme-color]').content=dark?'#111827':'#eef3f8'}
function setupMenu(){const m=$('#sideMenu'),o=$('#menuOverlay');$('#menuOpen').onclick=()=>{m.classList.add('open');o.classList.add('open')};const close=()=>{m.classList.remove('open');o.classList.remove('open')};$('#menuClose').onclick=close;o.onclick=close;$('#themeTop').onclick=$('#themeMenu').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');theme(localStorage.getItem(LS_THEME)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}
function options(el,arr,label){el.innerHTML=arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(label)el.insertAdjacentHTML('afterbegin',`<option value="">${label}</option>`)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function init(){options($('#keySelect'),Object.keys(data));bindKey();$('#keySelect').onchange=bindKey;$('#groupSelect').onchange=bindGroup;$('#scaleSelect').onchange=showSelected;renderChips();$('#searchInput').oninput=search;$('#clearSearch').onclick=()=>{$('#searchInput').value='';search()};$('#instrument').onchange=drawFretboard;$('#compareScale').onchange=renderCompare;$('#favBtn').onclick=toggleFav;$$('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));showSelected()}
function bindKey(){const key=$('#keySelect').value,groups=Object.keys(data[key]||{});options($('#groupSelect'),groups);bindGroup()}function bindGroup(){const key=$('#keySelect').value,g=$('#groupSelect').value,names=Object.keys(data[key]?.[g]||{});options($('#scaleSelect'),names);showSelected()}
function currentObj(){return flat.find(x=>x.key===$('#keySelect').value&&x.group===$('#groupSelect').value&&x.name===$('#scaleSelect').value)}
function go(x){$('#keySelect').value=x.key;bindKey();$('#groupSelect').value=x.group;bindGroup();$('#scaleSelect').value=x.name;showSelected();scrollTo({top:0,behavior:'smooth'})}
function showSelected(){current=currentObj();if(!current)return;const notes=current.arr.map(x=>x.name||''),degrees=current.arr.map(x=>x.degree||'');$('#groupLabel').textContent=current.group;$('#scaleTitle').textContent=`${current.key} ${current.name}`;$('#scaleSubtitle').textContent=current.moods.concat(current.genres).slice(0,4).join('・');const featureIndex=Math.max(1,notes.length>4?3:1);$('#notes').innerHTML=notes.map((n,i)=>`<div class="note ${i===0?'root':''} ${i===featureIndex?'feature':''}">${esc(n)}</div>`).join('');$('#degrees').innerHTML=degrees.map(d=>`<div class="degree">${esc(d)}</div>`).join('');$('#description').textContent=current.desc||'このスケールの構成音と響きを確認して、実際に鳴らしながら特徴をつかもう。';$('#featureText').textContent=notes[featureIndex]?`${notes[featureIndex]}（${degrees[featureIndex]||'特徴音'}）を意識すると個性が出やすい。`:'ルート音との距離感を意識しよう。';$('#chordText').textContent=chordsFor(current);$('#parentText').textContent=parentFor(current);$('#genreText').textContent=current.genres.join('・')||'幅広いジャンル';$('#tipText').textContent=tipFor(current);updateFav();drawFretboard();fillCompare();addHistory();renderSide()}
function chordsFor(x){const n=norm(x.name);if(/altered|オルタード/.test(n))return `${x.key}7alt、${x.key}7♭9、${x.key}7♯9`;if(/dorian|ドリアン/.test(n))return `${x.key}m7、${x.key}m6`;if(/mixolydian|ミクソ/.test(n))return `${x.key}7、${x.key}9`;if(/lydian|リディアン/.test(n))return `${x.key}maj7(#11)`;if(/minor|マイナー/.test(n))return `${x.key}m、${x.key}m7`;if(/blues|ブルース/.test(n))return `${x.key}7、${x.key}ブルース進行`;return `${x.key}、${x.key}maj7、${x.key}6`}
function parentFor(x){const n=norm(x.name);const map=[['dorian','メジャースケールの第2モード'],['phrygian','メジャースケールの第3モード'],['lydian','メジャースケールの第4モード'],['mixolydian','メジャースケールの第5モード'],['aeolian','メジャースケールの第6モード'],['locrian','メジャースケールの第7モード']];const hit=map.find(([k])=>n.includes(k));return hit?hit[1]:'同主調・平行調と比較すると理解しやすい。'}function tipFor(x){if(x.moods.includes('和風'))return'主音を伸ばし、音数を絞って余白を作ると和風の響きが出やすい。';if(x.genres.includes('ジャズ'))return'コードトーンを着地点にして、特徴音を経過音として使うと自然。';if(x.genres.includes('ロック'))return'低音弦のルートを軸に、短いフレーズを反復すると使いやすい。';return'まず上昇・下降を歌いながら弾き、ルートへ戻る感覚を覚えよう。'}
function renderChips(){const make=(id,list,type)=>{$(id).innerHTML=list.map(x=>`<button class="chip" data-${type}="${x}">${x}</button>`).join('');$$(`[data-${type}]`).forEach(b=>b.onclick=()=>{b.classList.toggle('active');search()})};make('#moodChips',tags.moods,'mood');make('#genreChips',tags.genres,'genre')}
function search(){const q=norm($('#searchInput').value),moods=$$('[data-mood].active').map(x=>x.dataset.mood),genres=$$('[data-genre].active').map(x=>x.dataset.genre);const r=flat.filter(x=>(!q||norm(`${x.key} ${x.group} ${x.name} ${x.desc} ${x.moods} ${x.genres}`).includes(q))&&(!moods.length||moods.some(m=>x.moods.includes(m)))&&(!genres.length||genres.some(g=>x.genres.includes(g)))).slice(0,18);$('#searchResults').className='result-list';$('#searchResults').innerHTML=r.length?r.map((x,i)=>`<button class="mini" data-result="${i}"><b>${esc(x.key)} ${esc(x.name)}</b><span>${esc(x.group)}・${esc(x.moods.concat(x.genres).join('・'))}</span></button>`).join(''):'<p class="empty">該当するスケールがないよ</p>';$$('[data-result]').forEach(b=>b.onclick=()=>go(r[+b.dataset.result]))}
function id(x){return `${x.key}|${x.group}|${x.name}`}function store(k,v){localStorage.setItem(k,JSON.stringify(v))}function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}function toggleFav(){let a=load(LS_FAV),v=id(current);a=a.includes(v)?a.filter(x=>x!==v):[v,...a].slice(0,30);store(LS_FAV,a);updateFav();renderSide()}function updateFav(){const on=load(LS_FAV).includes(id(current));$('#favBtn').classList.toggle('on',on);$('#favBtn').textContent=on?'★ お気に入り済み':'☆ お気に入り'}function addHistory(){let a=load(LS_HIST).filter(x=>x!==id(current));a.unshift(id(current));store(LS_HIST,a.slice(0,10))}function byId(v){return flat.find(x=>id(x)===v)}function renderList(el,arr){el.innerHTML=arr.map(byId).filter(Boolean).map((x,i)=>`<button class="mini" data-open="${esc(id(x))}"><b>${esc(x.key)} ${esc(x.name)}</b><span>${esc(x.group)}</span></button>`).join('')||'<p class="empty">まだありません</p>';el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(byId(b.dataset.open)))}function renderSide(){renderList($('#favorites'),load(LS_FAV));renderList($('#history'),load(LS_HIST))}
const chrom=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],alias={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};function pc(n){return chrom.indexOf(alias[n]||n.replace(/[^A-G#b]/g,''))}function midi(n,oct=4){return 12*(oct+1)+pc(n)}function play(mode){const ns=current.arr.map(x=>x.name).filter(Boolean),seq=mode==='down'?[...ns].reverse():mode==='both'?[...ns,...ns.slice(0,-1).reverse()]:mode==='random'?[...ns].sort(()=>Math.random()-.5):ns;const ctx=new(AudioContext||webkitAudioContext)(),gap=+$('#tempo').value;seq.forEach((n,i)=>setTimeout(()=>{const o=ctx.createOscillator(),g=ctx.createGain(),f=440*Math.pow(2,(midi(n)-69)/12);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.42);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.45)},i*gap))}
function drawFretboard(){if(!current)return;const tuning={guitar:['E','B','G','D','A','E'],bass:['G','D','A','E'],ukulele:['A','E','C','G']}[$('#instrument').value],set=new Set(current.arr.map(x=>pc(x.name))),root=pc(current.arr[0]?.name);let h='<div></div>'+Array.from({length:13},(_,i)=>`<div class="fret-label">${i}</div>`).join('');tuning.forEach(s=>{h+=`<div class="string-label">${s}</div>`;for(let f=0;f<=12;f++){const p=(pc(s)+f)%12;h+=`<div class="fret">${set.has(p)?`<span class="dot ${p===root?'root':''}">${chrom[p]}</span>`:''}</div>`}});$('#fretboard').innerHTML=h}
function fillCompare(){const same=flat.filter(x=>x.key===current.key&&id(x)!==id(current));options($('#compareScale'),same.map(id));renderCompare()}function renderCompare(){const b=byId($('#compareScale').value)||flat.find(x=>x.key===current.key&&id(x)!==id(current));if(!b)return;const aNotes=current.arr.map(x=>x.name),bNotes=b.arr.map(x=>x.name),aset=new Set(aNotes.map(pc)),bset=new Set(bNotes.map(pc));const panel=x=>`<div class="compare-panel"><h3>${esc(x.key)} ${esc(x.name)}</h3><p>${x.arr.map(n=>`<span class="${(x===current?bset:aset).has(pc(n.name))?'':'diff'}">${esc(n.name)}</span>`).join(' · ')}</p><small>${esc(x.desc||'')}</small></div>`;$('#compareGrid').innerHTML=panel(current)+panel(b)}
setupMenu();fetch('scales.json').then(r=>r.json()).then(d=>{data=d;flatten();init()}).catch(()=>{$('#scaleTitle').textContent='データを読み込めませんでした'});
</script>
</body></html>
