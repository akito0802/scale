<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4efe6">
<title>NEET NOTE スケール辞典</title>
<style>
:root{--bg:#f4efe6;--panel:#fffdf8;--panel2:#f7f2e9;--ink:#20252d;--muted:#6f746f;--line:#ddd4c6;--accent:#8b6f47;--accent2:#eadfce;--gold:#bd8534;--root:#a95f50;--shadow:0 10px 30px rgba(65,48,28,.12)}
html[data-theme=dark]{--bg:#141311;--panel:#211f1b;--panel2:#2b2823;--ink:#f6f1e8;--muted:#b9b1a4;--line:#474139;--accent:#c3a36c;--accent2:#3d352a;--gold:#dcad60;--root:#c87868;--shadow:0 12px 34px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.shell{max-width:1040px;margin:auto;padding:22px 14px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand{flex:1}.brand small{color:var(--muted);font-weight:800;letter-spacing:.15em}.brand h1{margin:3px 0 0;font-size:clamp(1.9rem,6vw,3rem)}
button,select,input{font:inherit}.icon,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:13px;cursor:pointer}.icon{width:44px;height:44px}.btn{min-height:42px;padding:0 14px;font-weight:800}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.on{background:#f1dfaa;color:#674916}.card,details{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px}.card{padding:18px}
.toolbar{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:10px}.toolbar input,.toolbar select,.compare select{width:100%;height:46px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:0 12px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pill{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.84rem}
.heroTop{display:flex;gap:12px;align-items:flex-start}.heroTop>div{flex:1}.eyebrow{margin:0;color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.12em}.hero h2{margin:6px 0 4px;font-size:1.9rem}.aliases{color:var(--muted);margin:0}.notes,.degrees{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px}.notes{margin-top:18px}.note{display:grid;place-items:center;height:50px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);font-weight:900}.note.root{background:var(--root);color:#fff;border-color:var(--root)}.note.feature{outline:3px solid color-mix(in srgb,var(--gold) 60%,transparent)}.degree{text-align:center;color:var(--muted);font-size:.82rem;padding-top:5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}summary{padding:18px 20px;font-weight:900;cursor:pointer;list-style:none}summary::after{content:"＋";float:right;color:var(--accent)}details[open] summary{border-bottom:1px solid var(--line)}details[open] summary::after{content:"−"}.body{padding:18px 20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{padding:15px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.box.wide{grid-column:1/-1}.box b{display:block;margin-bottom:7px}.box p{margin:0;line-height:1.7;color:var(--muted)}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rating{padding:13px;background:var(--panel2);border:1px solid var(--line);border-radius:13px}.stars{color:var(--gold);font-size:.9rem;white-space:nowrap}
.progressions,.phrases{display:grid;gap:8px}.progression,.phrase{padding:12px 13px;border:1px solid var(--line);background:var(--panel2);border-radius:12px}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px}.phrase code{white-space:normal}
.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.diff{color:var(--gold);font-weight:900}.lower{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{display:grid;gap:8px}.mini{width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink)}.mini span{display:block;color:var(--muted);font-size:.8rem}
.menu{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);z-index:10;background:var(--panel);padding:20px;transform:translateX(-110%);transition:.22s;box-shadow:15px 0 35px var(--shadow)}.menu.open{transform:none}.overlay{position:fixed;inset:0;background:#0007;z-index:9;display:none}.overlay.open{display:block}.menu a{display:block;padding:13px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:800}.menu a:hover{background:var(--panel2)}.empty{color:var(--muted)}
@media(max-width:760px){.toolbar{grid-template-columns:1fr}.grid,.compareGrid,.lower{grid-template-columns:1fr}.ratings{grid-template-columns:1fr 1fr}.box.wide{grid-column:auto}.hero h2{font-size:1.5rem}.card{padding:15px}}
</style>
</head>
<body>
<div id="overlay" class="overlay"></div>
<nav id="menu" class="menu"><button id="close" class="icon">×</button><h2>NEET NOTE</h2>
<a href="https://akito0802.github.io/NEET-note/">📝 ノート</a><a href="./">🎸 スケール</a><a href="https://akito0802.github.io/-h/">🎵 指板</a><a href="https://akito0802.github.io/Cordhyo-/index.html">📚 コード辞典</a><a href="https://akito0802.github.io/NEET-note/tools.html">🧰 ツール</a></nav>
<main class="shell">
<header><button id="open" class="icon">☰</button><div class="brand"><small>NEET NOTE MUSIC THEORY</small><h1>スケール辞典</h1></div><button id="theme" class="icon">◐</button></header>
<section class="card"><div class="toolbar"><input id="search" placeholder="スケール名・別名・雰囲気で検索"><select id="key"></select><select id="group"></select><select id="scale"></select></div><div class="stats"><span class="pill" id="count"></span><span class="pill" id="groupCount"></span><span class="pill" id="aliasState"></span></div></section>
<section class="card hero"><div class="heroTop"><div><p id="groupLabel" class="eyebrow"></p><h2 id="title">読み込み中...</h2><p id="aliases" class="aliases"></p></div><button id="fav" class="btn">♡ お気に入り</button></div><div id="notes" class="notes"></div><div id="degrees" class="degrees"></div><div class="actions"><button class="btn primary" data-play="up">▶ 上昇</button><button class="btn" data-play="down">下降</button><button class="btn" data-play="both">往復</button><button class="btn" data-play="random">ランダム</button><select id="tempo" class="btn"><option value="520">ゆっくり</option><option value="320" selected>普通</option><option value="190">速い</option></select></div></section>
<div id="details">
<details open><summary>基本情報と評価</summary><div class="body"><div class="ratings"><div class="rating">難易度<br><span id="difficulty" class="stars"></span></div><div class="rating">おすすめ<br><span id="recommend" class="stars"></span></div><div class="rating">使用頻度<br><span id="usage" class="stars"></span></div><div class="rating">初心者向け<br><span id="beginner" class="stars"></span></div></div><div class="grid" style="margin-top:12px"><div class="box wide"><b>特徴</b><p id="description"></p></div><div class="box"><b>特徴音</b><p id="feature"></p></div><div class="box"><b>対応コード</b><p id="chords"></p></div><div class="box"><b>別名・同義名</b><p id="aliasInfo"></p></div><div class="box"><b>親スケール・関連</b><p id="related"></p></div></div></div></details>
<details open><summary>音楽的アプローチ</summary><div class="body"><div class="grid"><div class="box wide"><b>使い方</b><p id="approach"></p></div><div class="box"><b>アヴォイド・注意点</b><p id="avoid"></p></div><div class="box"><b>似た雰囲気・ジャンル</b><p id="mood"></p></div></div></div></details>
<details open><summary>コード進行例</summary><div class="body"><div id="progressions" class="progressions"></div></div></details>
<details open><summary>フレーズ例</summary><div class="body"><div id="phrases" class="phrases"></div></div></details>
<details><summary>有名曲タイプ・豆知識・連携</summary><div class="body"><div class="grid"><div class="box"><b>有名曲に近い使われ方</b><p id="song"></p></div><div class="box"><b>豆知識</b><p id="trivia"></p></div><div class="box wide"><b>コード辞典との連携</b><p id="link"></p><p style="margin-top:9px"><a class="btn" href="https://akito0802.github.io/Cordhyo-/index.html">コード辞典を開く</a></p></div></div></div></details>
</div>
<section class="card compare"><h2>比較モード</h2><select id="compare"></select><div id="compareGrid" class="compareGrid"></div></section>
<div class="lower"><section class="card"><h2>お気に入り</h2><div id="favorites" class="list"></div></section><section class="card"><h2>最近見た</h2><div id="history" class="list"></div></section></div>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let data={},flat=[],current=null;const F='scale-favorites-v3',H='scale-history-v3';
const aliases={メジャー:['Ionian','アイオニアン'],ナチュラルマイナー:['Aeolian','エオリアン'],ドリアン:['Dorian'],フリジアン:['Phrygian'],リディアン:['Lydian'],ミクソリディアン:['Mixolydian'],ロクリアン:['Locrian'],ハーモニックマイナー:['Harmonic Minor'],メロディックマイナー:['Melodic Minor'],オルタード:['Super Locrian','Altered Dominant'],ホールトーン:['Whole Tone'],ディミニッシュ:['Octatonic'],ペンタトニック:['Major Pentatonic'],マイナーペンタトニック:['Minor Pentatonic'],都節:['Miyako-bushi'],琉球:['Ryukyu']};
const profiles=[
[/オルタード|altered/i,{r:[5,5,4,2],m:'強い緊張感・モダンジャズ',c:'7alt、7(b9)、7(#9)、7(b13)',a:'ドミナント上で変化音を短く強調し、半音でコードトーンへ解決する。',v:'長く止めるより、3度や♭7へ滑らかに解決する。',p:['V7alt → Im','IIm7♭5 → V7alt → Im'],s:'ビバップ以降のジャズやフュージョンの緊張場面。',t:'メロディックマイナー第7モードとして整理できる。'}],
[/ドリアン|dorian/i,{r:[3,5,4,3],m:'都会的・ファンク・ジャズ',c:'m7、m6、m9',a:'短3度でマイナー感を出しつつ、長6度を特徴音として伸ばす。',v:'長6度を使わないと普通のナチュラルマイナーに聞こえやすい。',p:['Im7 → IV7','Im7 → ♭VIImaj7'],s:'モードジャズ、ファンク、都会的なロック。',t:'メジャースケール第2モード。'}],
[/ミクソ|mixolydian/i,{r:[2,5,5,4],m:'開放的・ブルージー・ファンク',c:'7、9、13',a:'長3度と短7度の対比を中心に、反復リフを作る。',v:'3度を含むコード上では4度を長く伸ばしすぎない。',p:['I7 → ♭VII','I7 → IV7'],s:'ブルースロック、ファンク、ジャム系。',t:'メジャースケール第5モード。'}],
[/リディアン|lydian/i,{r:[3,4,3,2],m:'浮遊感・幻想的・映画的',c:'maj7(#11)、maj9(#11)',a:'#4を印象的に置き、長3度や5度へ解決する。',v:'#4を強調しすぎると不安定になるため、休符も使う。',p:['Imaj7 → II','Imaj7(#11)を持続'],s:'映画音楽、ゲーム音楽、幻想的なポップス。',t:'メジャースケール第4モード。'}],
[/フリジアン|phrygian/i,{r:[4,4,3,2],m:'異国的・暗い・激しい',c:'m、m7、sus(b9)',a:'♭2を短く提示し、ルートへ半音解決する。',v:'♭2を長く固定すると濁りやすい。',p:['Im → ♭II','Im → ♭II → ♭VII'],s:'フラメンコ、メタル、劇伴。',t:'メジャースケール第3モード。'}],
[/ブルース/i,{r:[2,5,5,5],m:'泥臭い・感情的・ロック',c:'7、m7、ブルース進行',a:'ブルーノートを経過音として使い、チョーキングや休符で表情を作る。',v:'♭5などのブルーノートは安定音へ解決すると自然。',p:['I7 → IV7 → I7 → V7','I7 → IV7 → V7 → IV7'],s:'ブルース、ロック、ソウル。',t:'メジャーとマイナーの響きを同時に含む。'}],
[/ペンタ/i,{r:[1,5,5,5],m:'親しみやすい・万能',c:'メジャー／マイナー系全般',a:'短いモチーフを反復し、リズム・休符・奏法で変化をつける。',v:'音の衝突は少ないが、同じ運指だけだと単調になりやすい。',p:['I → IV → V','Im → ♭VII → ♭VI'],s:'ポップス、ロック、民謡。',t:'世界各地で独立に見られる5音音階。'}],
[/マイナー|aeolian|minor/i,{r:[2,5,5,5],m:'切ない・哀愁・落ち着き',c:'m、m7、m9',a:'♭3・♭6・♭7を意識し、ルートか5度へ戻す。',v:'♭6を長く伸ばすと暗さが強く出る。',p:['Im → ♭VI → ♭III → ♭VII','Im → IVm → Vm → Im'],s:'バラード、ロック、ゲーム音楽。',t:'ナチュラルマイナーはメジャー第6モード。'}],
[/メジャー|ionian|major/i,{r:[1,5,5,5],m:'明るい・安定・王道',c:'maj7、6、add9',a:'1・3・5度へ着地し、2・6度を経過音として使う。',v:'4度は3度と半音でぶつかるため、長く伸ばしすぎない。',p:['I → IV → V → I','I → V → VIm → IV'],s:'王道ポップス、ロック、童謡。',t:'西洋音楽の基準となる音階。'}]
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase();
function flatten(){flat=[];for(const [key,gs] of Object.entries(data))for(const [group,ss] of Object.entries(gs))for(const [name,arr] of Object.entries(ss)){const desc=arr?.[0]?.description||'';flat.push({key,group,name,arr,desc,alias:aliases[name]||[]})}}
function profile(x){for(const [r,p] of profiles)if(r.test(x.name+' '+x.group))return p;return{r:[3,3,2,3],m:'個性的・実験的・民族的',c:'ルートを基準にした持続コード、sus、パワーコード',a:'特徴音を一度提示したあと、ルートかコードトーンへ解決する。',v:'特徴音を詰め込みすぎず、短いモチーフで響きを確認する。',p:['Iを持続 → 特徴音を強調','I → IV → V → I'],s:'劇伴、ゲーム音楽、民族音楽、実験音楽。',t:'一般的な機能和声より、響きそのものを活かすと使いやすい。'}}
function stars(n){return'★'.repeat(n)+'☆'.repeat(5-n)}
function opts(el,a,label=x=>x){el.innerHTML=a.map(x=>`<option value="${esc(x)}">${esc(label(x))}</option>`).join('')}
function bindKey(){opts($('#group'),Object.keys(data[$('#key').value]||{}));bindGroup()}
function bindGroup(){opts($('#scale'),Object.keys(data[$('#key').value]?.[$('#group').value]||{}));show()}
function obj(){return flat.find(x=>x.key===$('#key').value&&x.group===$('#group').value&&x.name===$('#scale').value)}
function id(x){return`${x.key}|${x.group}|${x.name}`}
function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function go(x){$('#key').value=x.key;bindKey();$('#group').value=x.group;bindGroup();$('#scale').value=x.name;show();scrollTo({top:0,behavior:'smooth'})}
function show(){
 current=obj();if(!current)return;const p=profile(current),ns=current.arr.map(v=>v.name),ds=current.arr.map(v=>v.degree),feature=Math.min(ns.length-1,Math.max(1,ns.length===5?3:2));
 $('#groupLabel').textContent=current.group;$('#title').textContent=`${current.key} ${current.name}`;$('#aliases').textContent=current.alias.length?'別名: '+current.alias.join(' / '):'別名登録なし';
 $('#notes').innerHTML=ns.map((n,i)=>`<div class="note ${i===0?'root':''} ${i===feature?'feature':''}">${esc(n)}</div>`).join('');
 $('#degrees').innerHTML=ds.map(d=>`<div class="degree">${esc(d)}</div>`).join('');
 const basic=(current.desc||'構成音を鳴らして響きを確認しよう。').split('【音楽的アプローチ】')[0].trim();
 const embedded=(current.desc||'').split('【音楽的アプローチ】')[1]?.trim();
 $('#description').textContent=basic;$('#feature').textContent=`${ns[feature]||ns[1]}（${ds[feature]||'特徴音'}）を意識すると個性が出やすい。`;$('#chords').textContent=`${current.key}${p.c}`;
 $('#aliasInfo').textContent=current.alias.length?`${current.name} = ${current.alias.join(' / ')}`:'この辞典では独立した名称として登録。';$('#related').textContent=related(current);
 $('#approach').textContent=embedded||p.a;$('#avoid').textContent=p.v;$('#mood').textContent=p.m;$('#song').textContent=p.s;$('#trivia').textContent=p.t;$('#link').textContent=`${current.key}をルートにした ${p.c} をコード辞典で確認すると、スケールとの対応を理解しやすい。`;
 ['difficulty','recommend','usage','beginner'].forEach((k,i)=>$('#'+k).textContent=stars(p.r[i]));
 $('#progressions').innerHTML=p.p.map(v=>`<div class="progression">${esc(v)}</div>`).join('');
 const ph=[ns.slice(0,Math.min(5,ns.length)),[ns[0],ns[Math.min(2,ns.length-1)],ns[Math.min(1,ns.length-1)],ns[Math.min(3,ns.length-1)],ns[0]]];
 $('#phrases').innerHTML=ph.map((a,i)=>`<div class="phrase"><code>${esc(a.join(' - '))}</code><button class="btn" data-phrase="${i}">▶ 再生</button></div>`).join('');
 $$('[data-phrase]').forEach(b=>b.onclick=()=>playNotes(ph[+b.dataset.phrase]));
 updateFav();history();renderLists();fillCompare();
}
function related(x){if(/ドリアン/i.test(x.name))return'メジャー第2モード。ナチュラルマイナーとの違いは6度。';if(/ミクソ/i.test(x.name))return'メジャー第5モード。メジャーとの違いは♭7。';if(/リディアン/i.test(x.name))return'メジャー第4モード。メジャーとの違いは#4。';return'同主調・平行調・ペンタトニックと比較すると理解しやすい。'}
function toggleFav(){let a=load(F),v=id(current);a=a.includes(v)?a.filter(x=>x!==v):[v,...a].slice(0,40);save(F,a);updateFav();renderLists()}
function updateFav(){const on=load(F).includes(id(current));$('#fav').classList.toggle('on',on);$('#fav').textContent=on?'♥ お気に入り済み':'♡ お気に入り'}
function history(){let a=load(H).filter(x=>x!==id(current));a.unshift(id(current));save(H,a.slice(0,12))}
function renderList(el,a){el.innerHTML=a.map(v=>flat.find(x=>id(x)===v)).filter(Boolean).map(x=>`<button class="mini" data-id="${esc(id(x))}"><b>${esc(x.key)} ${esc(x.name)}</b><span>${esc(x.group)}</span></button>`).join('')||'<p class="empty">まだありません</p>';el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>go(flat.find(x=>id(x)===b.dataset.id)))}
function renderLists(){renderList($('#favorites'),load(F));renderList($('#history'),load(H))}
function fillCompare(){const a=flat.filter(x=>x.key===current.key&&id(x)!==id(current));opts($('#compare'),a,id);compare()}
function compare(){const b=flat.find(x=>id(x)===$('#compare').value);if(!b)return;const A=new Set(current.arr.map(x=>x.name)),B=new Set(b.arr.map(x=>x.name));const panel=(x,other)=>`<div class="box"><b>${esc(x.key)} ${esc(x.name)}</b><p>${x.arr.map(n=>`<span class="${other.has(n.name)?'':'diff'}">${esc(n.name)}</span>`).join(' · ')}</p></div>`;$('#compareGrid').innerHTML=panel(current,B)+panel(b,A)}
const chrom=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],map={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
function pc(n){return chrom.indexOf(map[n]||String(n).replace(/[^A-G#b]/g,''))}
function playNotes(ns){const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),gap=+$('#tempo').value;ns.forEach((n,i)=>setTimeout(()=>{const o=ctx.createOscillator(),g=ctx.createGain(),m=60+Math.max(0,pc(n));o.frequency.value=440*Math.pow(2,(m-69)/12);o.type='triangle';g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.2,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.45);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.48)},i*gap))}
function play(mode){let a=current.arr.map(x=>x.name);if(mode==='down')a=[...a].reverse();if(mode==='both')a=[...a,...a.slice(0,-1).reverse()];if(mode==='random')a=[...a].sort(()=>Math.random()-.5);playNotes(a)}
function search(q){q=norm(q);if(!q)return;const x=flat.find(x=>norm([x.name,x.group,x.key,x.desc,...x.alias].join(' ')).includes(q));if(x)go(x)}
function init(){opts($('#key'),Object.keys(data));bindKey();$('#key').onchange=bindKey;$('#group').onchange=bindGroup;$('#scale').onchange=show;$('#compare').onchange=compare;$('#fav').onclick=toggleFav;$$('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));$('#search').onchange=e=>search(e.target.value);$('#search').onkeydown=e=>{if(e.key==='Enter')search(e.target.value)};$('#count').textContent=`登録: ${flat.length}スケール`;$('#groupCount').textContent=`分類: ${new Set(flat.map(x=>x.group)).size}種類`;$('#aliasState').textContent=`別名対応: ${flat.filter(x=>x.alias.length).length}件`;show()}
$('#open').onclick=()=>{$('#menu').classList.add('open');$('#overlay').classList.add('open')};$('#close').onclick=$('#overlay').onclick=()=>{$('#menu').classList.remove('open');$('#overlay').classList.remove('open')};
function theme(v){document.documentElement.dataset.theme=v;localStorage.setItem('scale-theme',v)}$('#theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');theme(localStorage.getItem('scale-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
fetch('scales.json?v=20260730-5').then(r=>r.json()).then(d=>{data=d;flatten();init()}).catch(()=>$('#title').textContent='データを読み込めませんでした');
</script></body></html>
