<style>
:root{color-scheme:light;--bg:#f4efe6;--panel:#fffdf8;--panel2:#f7f2e9;--ink:#1f2937;--muted:#6b7280;--line:#ded6c9;--accent:#8b6f47;--accent2:#e9e1d4;--hover:#f2eee6;--root:#a85d4c;--feature:#c28b39;--danger:#c62828;--shadow:0 8px 24px rgba(80,60,30,.12)}
html[data-theme="dark"]{color-scheme:dark;--bg:#141311;--panel:#201e1a;--panel2:#2a2722;--ink:#f5f1e8;--muted:#b8b1a5;--line:#454039;--accent:#c6a66f;--accent2:#3b342a;--hover:#302c26;--root:#c77a68;--feature:#d5aa62;--danger:#ef9a9a;--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;transition:.2s}.shell{max-width:920px;margin:auto;padding:28px 18px 64px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}.title{flex:1}.title p{margin:0 0 5px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.16em}.title h1{margin:0;font-family:"Hannotate SC","Chalkboard SE",-apple-system,sans-serif;font-size:clamp(2rem,7vw,3rem);letter-spacing:-.03em}button,select{font:inherit}.icon-btn,.menu-close{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer}.theme-top{padding:0 14px;width:auto;font-weight:700}.menu-overlay{position:fixed;inset:0;z-index:98;background:rgba(17,24,39,.42);opacity:0;pointer-events:none;transition:.2s}.menu-overlay.open{opacity:1;pointer-events:auto}.side-menu{position:fixed;inset:0 auto 0 0;z-index:99;width:min(82vw,300px);padding:24px 18px;background:var(--panel);transform:translateX(-110%);transition:.22s;box-shadow:14px 0 34px var(--shadow)}.side-menu.open{transform:none}.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.side-head h2{margin:0;font-size:1.15rem}.menu-link,.theme-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;margin-bottom:8px;border:0;border-radius:12px;background:transparent;color:var(--ink);text-decoration:none;font-weight:700;text-align:left}.menu-link:hover,.theme-toggle:hover{background:var(--hover)}.menu-link.current{background:var(--accent2)}.theme-toggle{justify-content:center;margin-top:14px;border:1px solid var(--line);background:var(--panel)}
.card,details{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}.card{padding:20px}.filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.filter-grid select,.compare-select select,#tempo{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0 12px}.hero-head{display:flex;gap:12px;align-items:flex-start}.hero-head>div{flex:1}.eyebrow{margin:0 0 5px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.16em}.hero h2{margin:3px 0;font-size:1.8rem}.subtitle{margin:0;color:var(--muted)}.fav{height:40px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--ink);padding:0 14px;font-weight:700}.fav.on{background:#efe2bd;color:#6f5122}.note-row,.degree-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px;margin-top:16px}.note,.degree{height:48px;display:grid;place-items:center;border-radius:12px}.note{background:var(--panel2);border:1px solid var(--line);font-weight:800}.note.root{background:var(--root);border-color:var(--root);color:#fff}.note.feature{outline:3px solid color-mix(in srgb,var(--feature) 55%,transparent)}.degree{height:24px;color:var(--muted);font-size:.82rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{min-height:42px;border:0;border-radius:12px;padding:0 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 25%,transparent)}.btn.sub{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none}summary{display:flex;align-items:center;padding:18px 20px;font-weight:800;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'＋';margin-left:auto;color:var(--accent);font-size:1.2rem}details[open] summary::after{content:'−'}details[open] summary{border-bottom:1px solid var(--line)}.detail-body{padding:18px 20px}.info-grid,.rating-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.info,.rating,.progression,.phrase,.compare-panel{padding:15px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.info{min-height:132px}.info.wide{grid-column:1/-1}.info b{display:block;margin-bottom:8px}.info p{margin:0;color:var(--muted);line-height:1.65}.rating-head{display:flex;justify-content:space-between;gap:10px;font-weight:700}.stars{color:var(--feature);letter-spacing:.08em}.progressions,.phrase-box{display:grid;gap:9px}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px}.phrase code{font-size:1rem;word-break:break-word}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.compare-panel{min-height:150px}.compare-panel h3{margin:0 0 8px}.compare-panel p{line-height:1.8}.compare-panel small{color:var(--muted)}.diff{color:var(--feature);font-weight:800}.section-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.section-grid .card{margin:0;min-height:240px}.history-list{display:grid;gap:8px}.mini{min-height:64px;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:11px 12px;text-align:left;cursor:pointer}.mini b{display:block}.mini span,.empty{color:var(--muted);font-size:.82rem}
@media(max-width:760px){.shell{padding:18px 12px 48px}.title h1{font-size:2rem}.theme-top{width:42px;font-size:0}.theme-top::before{content:'◐';font-size:1rem}.filter-grid,.info-grid,.rating-grid,.compare-grid,.section-grid{grid-template-columns:1fr}.card{padding:16px}.info{min-height:0}.info.wide{grid-column:auto}.section-grid .card{min-height:0}.hero-head{align-items:center}.hero h2{font-size:1.5rem}summary,.detail-body{padding-left:16px;padding-right:16px}}
</style>

<body>
<div id="menuOverlay" class="menu-overlay"></div><nav id="sideMenu" class="side-menu"><div class="side-head"><h2>NEET NOTE</h2><button id="menuClose" class="menu-close">×</button></div><a class="menu-link" href="https://akito0802.github.io/NEET-note/">📝 ノート</a><a class="menu-link current" href="./">🎸 スケール</a><a class="menu-link" href="https://akito0802.github.io/-h/">🎵 指板</a><a class="menu-link" href="https://akito0802.github.io/Cordhyo-/index.html">📚 コード</a><a class="menu-link" href="https://akito0802.github.io/NEET-note/tools.html">🧰 ツール</a><button id="themeMenu" class="theme-toggle">🌙 ダークモード</button></nav>
<div class="shell"><header class="topbar"><button id="menuOpen" class="icon-btn">☰</button><div class="title"><p>NEET NOTE MUSIC THEORY</p><h1>スケール辞典</h1></div><button id="themeTop" class="icon-btn theme-top">🌙 ダーク</button></header>
<section class="card"><div class="filter-grid"><select id="keySelect"></select><select id="groupSelect"></select><select id="scaleSelect"></select></div></section>
<section class="card hero"><div class="hero-head"><div><p class="eyebrow" id="groupLabel"></p><h2 id="scaleTitle">読み込み中...</h2><p class="subtitle" id="scaleSubtitle"></p></div><button id="favBtn" class="fav">☆ お気に入り</button></div><div id="notes" class="note-row"></div><div id="degrees" class="degree-row"></div><div class="actions"><button class="btn" data-play="up">▶ 上昇</button><button class="btn sub" data-play="down">▶ 下降</button><button class="btn sub" data-play="both">▶ 上昇・下降</button><button class="btn sub" data-play="random">▶ ランダム</button><select id="tempo"><option value="500">ゆっくり</option><option value="320" selected>普通</option><option value="190">速い</option></select></div></section>
<details open><summary>基本情報</summary><div class="detail-body"><div class="rating-grid"><div class="rating"><div class="rating-head"><span>難易度</span><span id="difficultyStars" class="stars"></span></div></div><div class="rating"><div class="rating-head"><span>おすすめ度</span><span id="recommendStars" class="stars"></span></div></div><div class="rating"><div class="rating-head"><span>使用頻度</span><span id="usageStars" class="stars"></span></div></div><div class="rating"><div class="rating-head"><span>初心者向け</span><span id="beginnerStars" class="stars"></span></div></div></div><div class="info-grid" style="margin-top:12px"><div class="info"><b>特徴</b><p id="description"></p></div><div class="info"><b>特徴音</b><p id="featureText"></p></div><div class="info"><b>対応コード</b><p id="chordText"></p></div><div class="info"><b>親スケール</b><p id="parentText"></p></div><div class="info"><b>向いているジャンル</b><p id="genreText"></p></div><div class="info"><b>注意点</b><p id="cautionText"></p></div></div></div></details>
<details open><summary>実践で使う</summary><div class="detail-body"><div class="info-grid"><div class="info wide"><b>音楽的アプローチ</b><p id="approachText"></p></div><div class="info"><b>アヴォイドノート</b><p id="avoidText"></p></div><div class="info"><b>コードから見た候補</b><p id="relatedScaleText"></p></div></div><h3>コード進行例</h3><div id="progressions" class="progressions"></div><h3>フレーズ例</h3><div id="phrases" class="phrase-box"></div></div></details>
<details><summary>参考・豆知識</summary><div class="detail-body"><div class="info-grid"><div class="info"><b>似た響きの楽曲タイプ</b><p id="songLikeText"></p></div><div class="info"><b>豆知識</b><p id="triviaText"></p></div></div></div></details>
<section class="card"><h2>比較モード</h2><div class="compare-select"><select id="compareScale"></select></div><div id="compareGrid" class="compare-grid"></div></section><div class="section-grid"><section class="card"><h2>お気に入り</h2><div id="favorites" class="history-list"></div></section><section class="card"><h2>最近見たスケール</h2><div id="history" class="history-list"></div></section></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data={},current=null,flat=[];const LS_THEME='neet-note-theme',LS_FAV='scale-favorites-v2',LS_HIST='scale-history-v2',norm=s=>String(s||'').toLowerCase();
function infer(name,desc){const t=norm(name+' '+desc),m=[],g=[];if(/major|メジャー|ionian/.test(t))m.push('明るい');if(/minor|マイナー|aeolian/.test(t))m.push('切ない');if(/dimin|altered|locrian|オルタード/.test(t))m.push('不穏');if(/whole|lydian|リディアン/.test(t))m.push('幻想的');if(/japanese|都節|平調子|ヨナ抜き|琉球/.test(t))m.push('和風');if(/dorian|mixolydian|ドリアン|ミクソ/.test(t))m.push('おしゃれ');if(/phrygian|harmonic|フリジアン/.test(t))m.push('激しい');if(/pentatonic|ペンタ/.test(t))g.push('ロック','ポップス');if(/blues|ブルース/.test(t))g.push('ブルース','ロック');if(/jazz|bebop|altered|ジャズ/.test(t))g.push('ジャズ');if(/phrygian|harmonic minor/.test(t))g.push('メタル');if(/japanese|arab|spanish|gypsy|都節|琉球/.test(t))g.push('民族音楽','ゲーム音楽');if(!g.length)g.push('ポップス');return{moods:[...new Set(m)],genres:[...new Set(g)]}}
function flatten(){flat=[];Object.entries(data).forEach(([key,groups])=>Object.entries(groups).forEach(([group,scales])=>Object.entries(scales).forEach(([name,arr])=>{const desc=arr?.[0]?.description||'';flat.push({key,group,name,arr,desc,...infer(name,desc)})})))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function options(el,a){el.innerHTML=a.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function theme(v){document.documentElement.dataset.theme=v;localStorage.setItem(LS_THEME,v);const d=v==='dark';$('#themeTop').textContent=d?'☀️ ライト':'🌙 ダーク';$('#themeMenu').textContent=d?'☀️ ライトモード':'🌙 ダークモード';document.querySelector('meta[name=theme-color]').content=d?'#141311':'#f4efe6'}function setupMenu(){const m=$('#sideMenu'),o=$('#menuOverlay'),close=()=>{m.classList.remove('open');o.classList.remove('open')};$('#menuOpen').onclick=()=>{m.classList.add('open');o.classList.add('open')};$('#menuClose').onclick=o.onclick=close;$('#themeTop').onclick=$('#themeMenu').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');theme(localStorage.getItem(LS_THEME)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}
function bindKey(){const k=$('#keySelect').value;options($('#groupSelect'),Object.keys(data[k]||{}));bindGroup()}function bindGroup(){const k=$('#keySelect').value,g=$('#groupSelect').value;options($('#scaleSelect'),Object.keys(data[k]?.[g]||{}));show()}function currentObj(){return flat.find(x=>x.key===$('#keySelect').value&&x.group===$('#groupSelect').value&&x.name===$('#scaleSelect').value)}function go(x){$('#keySelect').value=x.key;bindKey();$('#groupSelect').value=x.group;bindGroup();$('#scaleSelect').value=x.name;show();scrollTo({top:0,behavior:'smooth'})}
function kind(x){const n=norm(x.name);for(const [r,k] of [[/altered|オルタード/,'altered'],[/dorian|ドリアン/,'dorian'],[/phrygian|フリジアン/,'phrygian'],[/lydian|リディアン/,'lydian'],[/mixolydian|ミクソ/,'mixolydian'],[/locrian|ロクリアン/,'locrian'],[/harmonic|ハーモニック/,'harmonic'],[/melodic|メロディック/,'melodic'],[/pentatonic|ペンタ/,'pentatonic'],[/blues|ブルース/,'blues'],[/whole|ホールトーン/,'whole'],[/dimin|ディミニッシュ/,'diminished'],[/minor|マイナー|aeolian/,'minor'],[/major|メジャー|ionian/,'major']])if(r.test(n))return k;return x.moods.includes('和風')?'japanese':'other'}
const profiles={major:[1,5,5,5,'4度を長く伸ばすと3度とぶつかりやすい。','4度は経過音として扱う。',['Imaj7 → IVmaj7 → V7 → Imaj7','I → V → vi → IV'],'王道ポップスや明るい主題歌。','西洋音楽の基準となる音階。'],minor:[2,5,5,5,'♭6を強調しすぎると暗さが強くなる。','着地点はルート・♭3・5度が安全。',['i → ♭VI → ♭III → ♭VII','i → iv → v → i'],'切ないバラードや哀愁のあるロック。','メジャースケールの第6モード。'],dorian:[3,5,4,3,'6度を出さないと普通のマイナーに聞こえやすい。','6度を特徴音として意識する。',['i7 → IV7','i7 → ♭VIImaj7'],'ジャズファンクや都会的なグルーヴ。','暗さと爽やかさを両立できる。'],mixolydian:[2,5,5,4,'メジャー7度を混ぜると曖昧になる。','4度は3度を含むコード上で注意。',['I7 → ♭VII','I7 → IV7'],'ブルースロックやファンク。','ドミナント7thと相性が良い。'],pentatonic:[1,5,5,5,'同じ形だけだと単調になりやすい。','大きなアヴォイドは少ない。',['I → IV → V','i → ♭VII → ♭VI'],'ロック、ポップス、民謡。','世界各地で見られる5音音階。'],blues:[2,5,5,5,'ブルーノートを長く固定すると濁る。','ブルーノートは安定音へ解決する。',['I7 → IV7 → I7 → V7','I7 → IV7 → V7 → IV7'],'ブルース、ロック、ソウル。','メジャーとマイナー感を同時に含む。'],other:[3,3,2,3,'特徴音を詰め込みすぎない。','コードトーンを着地点にする。',['I → IV → V → I'],'劇伴や実験的な楽曲。','特徴音と解決感を耳で覚えるのが実践的。']};function profile(x){return profiles[kind(x)]||profiles.other}function stars(n){return'★'.repeat(n)+'☆'.repeat(5-n)}
function approach(x){const k=kind(x),key=x.key,m={major:`${key}maj系コード上で1・3・5度へ着地し、2・6度を経過音にする。`,minor:`${key}m系コード上で♭3・♭6・♭7を意識し、ルートか5度へ戻す。`,dorian:`${key}m7上で6度を長めに響かせ、短いモチーフを反復する。`,mixolydian:`${key}7上で♭7を軸にし、3度との対比を作る。`,pentatonic:'短いモチーフを反復し、リズム・休符・奏法で変化をつける。',blues:'ブルーノートを経過音にして、チョーキングや休符で表情をつける。'};return m[k]||'特徴音を強調したあと、ルートまたはコードトーンへ解決する。'}
function chords(x){const k=kind(x);if(k==='dorian')return`${x.key}m7、${x.key}m6`;if(k==='mixolydian')return`${x.key}7、${x.key}9`;if(['minor','harmonic','melodic'].includes(k))return`${x.key}m、${x.key}m7`;if(k==='blues')return`${x.key}7、${x.key}ブルース進行`;return`${x.key}、${x.key}maj7、${x.key}6`}function parent(x){const n=norm(x.name),a=[['dorian','メジャーの第2モード'],['phrygian','メジャーの第3モード'],['lydian','メジャーの第4モード'],['mixolydian','メジャーの第5モード'],['aeolian','メジャーの第6モード'],['locrian','メジャーの第7モード']].find(([k])=>n.includes(k));return a?a[1]:'同主調・平行調と比較すると理解しやすい。'}function related(x){return`${x.key}ペンタトニック、同主調のメジャー／マイナー`}
function phrases(x){const n=x.arr.map(v=>v.name).filter(Boolean);return[n.slice(0,Math.min(5,n.length)),[n[0],n[Math.min(2,n.length-1)],n[Math.min(1,n.length-1)],n[Math.min(3,n.length-1)],n[0]]].map(v=>v.join(' - '))}function renderPhrases(x){const a=phrases(x);$('#phrases').innerHTML=a.map((p,i)=>`<div class="phrase"><code>${esc(p)}</code><button class="btn sub" data-phrase="${i}">▶ 再生</button></div>`).join('');$$('[data-phrase]').forEach(b=>b.onclick=()=>playNotes(a[+b.dataset.phrase].split(' - ')))}
function show(){current=currentObj();if(!current)return;const n=current.arr.map(x=>x.name||''),d=current.arr.map(x=>x.degree||''),f=Math.max(1,n.length>4?3:1),p=profile(current);$('#groupLabel').textContent=current.group;$('#scaleTitle').textContent=`${current.key} ${current.name}`;$('#scaleSubtitle').textContent=current.moods.concat(current.genres).slice(0,4).join('・');$('#notes').innerHTML=n.map((v,i)=>`<div class="note ${i===0?'root':''} ${i===f?'feature':''}">${esc(v)}</div>`).join('');$('#degrees').innerHTML=d.map(v=>`<div class="degree">${esc(v)}</div>`).join('');$('#description').textContent=(current.desc||'構成音を鳴らしながら響きを確認しよう。').replace(/【音楽的アプローチ】.*$/,'').trim();$('#featureText').textContent=n[f]?`${n[f]}（${d[f]||'特徴音'}）を意識すると個性が出やすい。`:'ルート音との距離感を意識しよう。';$('#chordText').textContent=chords(current);$('#parentText').textContent=parent(current);$('#genreText').textContent=current.genres.join('・');$('#cautionText').textContent=p[4];$('#avoidText').textContent=p[5];$('#approachText').textContent=approach(current);$('#relatedScaleText').textContent=related(current);$('#songLikeText').textContent=p[7];$('#triviaText').textContent=p[8];['difficulty','recommend','usage','beginner'].forEach((id,i)=>$('#'+id+'Stars').textContent=stars(p[i]));$('#progressions').innerHTML=p[6].map(v=>`<div class="progression">${esc(v)}</div>`).join('');renderPhrases(current);updateFav();fillCompare();history();renderSide()}
function id(x){return`${x.key}|${x.group}|${x.name}`}function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function byId(v){return flat.find(x=>id(x)===v)}function toggleFav(){let a=load(LS_FAV),v=id(current);a=a.includes(v)?a.filter(x=>x!==v):[v,...a].slice(0,30);save(LS_FAV,a);updateFav();renderSide()}function updateFav(){const on=load(LS_FAV).includes(id(current));$('#favBtn').classList.toggle('on',on);$('#favBtn').textContent=on?'★ お気に入り済み':'☆ お気に入り'}function history(){let a=load(LS_HIST).filter(x=>x!==id(current));a.unshift(id(current));save(LS_HIST,a.slice(0,10))}function renderList(el,a){el.innerHTML=a.map(byId).filter(Boolean).map(x=>`<button class="mini" data-open="${esc(id(x))}"><b>${esc(x.key)} ${esc(x.name)}</b><span>${esc(x.group)}</span></button>`).join('')||'<p class="empty">まだありません</p>';el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(byId(b.dataset.open)))}function renderSide(){renderList($('#favorites'),load(LS_FAV));renderList($('#history'),load(LS_HIST))}
const chrom=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],alias={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};function pc(n){return chrom.indexOf(alias[n]||String(n).replace(/[^A-G#b]/g,''))}function midi(n){return 60+pc(n)}function playNotes(ns){const ctx=new(AudioContext||webkitAudioContext)(),gap=+$('#tempo').value;ns.forEach((n,i)=>setTimeout(()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440*Math.pow(2,(midi(n)-69)/12);o.type='sine';g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.42);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.45)},i*gap))}function play(mode){const n=current.arr.map(x=>x.name).filter(Boolean),s=mode==='down'?[...n].reverse():mode==='both'?[...n,...n.slice(0,-1).reverse()]:mode==='random'?[...n].sort(()=>Math.random()-.5):n;playNotes(s)}
function fillCompare(){const a=flat.filter(x=>x.key===current.key&&id(x)!==id(current));options($('#compareScale'),a.map(id));compare()}function compare(){const b=byId($('#compareScale').value)||flat.find(x=>x.key===current.key&&id(x)!==id(current));if(!b)return;const as=new Set(current.arr.map(x=>pc(x.name))),bs=new Set(b.arr.map(x=>pc(x.name))),panel=(x,o)=>`<div class="compare-panel"><h3>${esc(x.key)} ${esc(x.name)}</h3><p>${x.arr.map(n=>`<span class="${o.has(pc(n.name))?'':'diff'}">${esc(n.name)}</span>`).join(' · ')}</p><small>${esc((x.desc||'').replace(/【音楽的アプローチ】.*$/,'').trim())}</small></div>`;$('#compareGrid').innerHTML=panel(current,bs)+panel(b,as)}
function init(){options($('#keySelect'),Object.keys(data));bindKey();$('#keySelect').onchange=bindKey;$('#groupSelect').onchange=bindGroup;$('#scaleSelect').onchange=show;$('#compareScale').onchange=compare;$('#favBtn').onclick=toggleFav;$$('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));show()}setupMenu();fetch('scales.json?v=20260730-3').then(r=>r.json()).then(d=>{data=d;flatten();init()}).catch(()=>$('#scaleTitle').textContent='データを読み込めませんでした');
</script></body></html>
