<style>:root{--bg:#f4efe6;--panel:#fffdf8;--panel2:#f7f2e9;--ink:#20252d;--muted:#6f746f;--line:#ddd4c6;--accent:#8b6f47;--accent2:#eadfce;--gold:#bd8534;--root:#a95f50;--shadow:0 10px 30px rgba(65,48,28,.12)}html[data-theme=dark]{--bg:#141311;--panel:#211f1b;--panel2:#2b2823;--ink:#f6f1e8;--muted:#b9b1a4;--line:#474139;--accent:#c3a36c;--accent2:#3d352a;--gold:#dcad60;--root:#c87868;--shadow:0 12px 34px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.shell{max-width:1040px;margin:auto;padding:22px 14px 60px}header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand{flex:1}.brand small{color:var(--muted);font-weight:800;letter-spacing:.15em}.brand h1{margin:3px 0 0;font-size:clamp(1.9rem,6vw,3rem)}button,select{font:inherit}.icon,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:13px;cursor:pointer}.icon{width:44px;height:44px}.btn{min-height:42px;padding:0 14px;font-weight:800}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.on{background:#f1dfaa;color:#674916}.card,details{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px}.card{padding:18px}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.toolbar select,.compare select{width:100%;height:46px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:0 12px}.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pill{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.84rem}.heroTop{display:flex;gap:12px;align-items:flex-start}.heroTop>div{flex:1}.eyebrow{margin:0;color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.12em}.hero h2{margin:6px 0 4px;font-size:1.9rem}.aliases{color:var(--muted);margin:0}.notes,.degrees{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px}.notes{margin-top:18px}.note{display:grid;place-items:center;height:50px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);font-weight:900}.note.root{background:var(--root);color:#fff;border-color:var(--root)}.note.feature{outline:3px solid color-mix(in srgb,var(--gold) 60%,transparent)}.degree{text-align:center;color:var(--muted);font-size:.82rem;padding-top:5px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}summary{padding:18px 20px;font-weight:900;cursor:pointer;list-style:none}summary::after{content:"＋";float:right;color:var(--accent)}details[open] summary{border-bottom:1px solid var(--line)}details[open] summary::after{content:"−"}.body{padding:18px 20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{padding:15px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.box.wide{grid-column:1/-1}.box b{display:block;margin-bottom:7px}.box p{margin:0;line-height:1.7;color:var(--muted)}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rating{padding:13px;background:var(--panel2);border:1px solid var(--line);border-radius:13px}.stars{color:var(--gold);font-size:.9rem;white-space:nowrap}.progressions,.phrases{display:grid;gap:8px}.progression,.phrase{padding:12px 13px;border:1px solid var(--line);background:var(--panel2);border-radius:12px}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px}.phrase code{white-space:normal}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.diff{color:var(--gold);font-weight:900}.lower{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{display:grid;gap:8px}.mini{width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink)}.mini span{display:block;color:var(--muted);font-size:.8rem}.menu{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);z-index:10;background:var(--panel);padding:20px;transform:translateX(-110%);transition:.22s;box-shadow:15px 0 35px var(--shadow)}.menu.open{transform:none}.overlay{position:fixed;inset:0;background:#0007;z-index:9;display:none}.overlay.open{display:block}.menu a{display:block;padding:13px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:800}.menu a:hover{background:var(--panel2)}.empty{color:var(--muted)}@media(max-width:760px){.toolbar{grid-template-columns:1fr}.grid,.compareGrid,.lower{grid-template-columns:1fr}.ratings{grid-template-columns:1fr 1fr}.box.wide{grid-column:auto}.hero h2{font-size:1.5rem}.card{padding:15px}}</style></head>
<body><div id="overlay" class="overlay"></div><nav id="menu" class="menu"><button id="close" class="icon">×</button><h2>NEET NOTE</h2><a href="https://akito0802.github.io/NEET-note/">📝 ノート</a><a href="./">🎸 スケール</a><a href="https://akito0802.github.io/-h/">🎵 指板</a><a href="https://akito0802.github.io/Cordhyo-/index.html">📚 コード辞典</a><a href="https://akito0802.github.io/NEET-note/tools.html">🧰 ツール</a></nav><main class="shell"><header><button id="open" class="icon">☰</button><div class="brand"><small>NEET NOTE MUSIC THEORY</small><h1>スケール辞典</h1></div><button id="theme" class="icon">◐</button></header><section class="card"><div class="toolbar"><select id="key"></select><select id="group"></select><select id="scale"></select></div><div class="stats"><span class="pill" id="count"></span><span class="pill" id="groupCount"></span><span class="pill" id="aliasState"></span></div></section><section class="card hero"><div class="heroTop"><div><p id="groupLabel" class="eyebrow"></p><h2 id="title">読み込み中...</h2><p id="aliases" class="aliases"></p></div><button id="fav" class="btn">♡ お気に入り</button></div><div id="notes" class="notes"></div><div id="degrees" class="degrees"></div><div class="actions"><button class="btn primary" data-play="up">▶ 上昇</button><button class="btn" data-play="down">下降</button><button class="btn" data-play="both">往復</button><button class="btn" data-play="random">🔀 ランダム再生</button><select id="tempo" class="btn"><option value="520">ゆっくり</option><option value="320" selected>普通</option><option value="190">速い</option></select></div></section><details open><summary>基本情報と評価</summary><div class="body"><div class="ratings"><div class="rating">難易度<br><span id="difficulty" class="stars"></span></div><div class="rating">おすすめ<br><span id="recommend" class="stars"></span></div><div class="rating">使用頻度<br><span id="usage" class="stars"></span></div><div class="rating">初心者向け<br><span id="beginner" class="stars"></span></div></div><div class="grid" style="margin-top:12px"><di <script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data={},flat=[],current=null;const F='scale-favorites-v3',H='scale-history-v3';const chrom=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];const aliases={メジャー:['Ionian','アイオニアン'],ナチュラルマイナー:['Aeolian','エオリアン'],ドリアン:['Dorian'],フリジアン:['Phrygian'],リディアン:['Lydian'],ミクソリディアン:['Mixolydian'],ロクリアン:['Locrian'],ハーモニックマイナー:['Harmonic Minor'],メロディックマイナー:['Melodic Minor'],オルタード:['Super Locrian'],ビバップドミナント:['Bebop Dominant'],ビバップメジャー:['Bebop Major'],ビバップドリアン:['Bebop Dorian'],ハンガリアンマイナー:['Hungarian Minor'],ダブルハーモニックメジャー:['Double Harmonic Major'],スパニッシュ8ノート:['Spanish 8 Tone'],アラビックスケール:['Arabic Scale'],ペルシアンスケール:['Persian Scale'],エニグマティック:['Enigmatic'],プロメテウス:['Prometheus'],インセンス:['Insen'],岩戸:['Iwato']};const extras=[['ジャズ','ビバップドミナント',[0,2,4,5,7,9,10,11],['1','2','3','4','5','6','♭7','7'],'ミクソリディアンに長7度を経過音として加えた8音音階。'],['ジャズ','ビバップメジャー',[0,2,4,5,7,8,9,11],['1','2','3','4','5','♭6','6','7'],'メジャーに♭6を経過音として加えた8音音階。'],['ジャズ','ビバップドリアン',[0,2,3,4,5,7,9,10],['1','2','♭3','3','4','5','6','♭7'],'ドリアンに長3度を経過音として加えた8音音階。'],['民族・エキゾチック','ハンガリアンマイナー',[0,2,3,6,7,8,11],['1','2','♭3','#4','5','♭6','7'],'増2度と#4が強い劇的なマイナー音階。'],['民族・エキゾチック','ダブルハーモニックメジャー',[0,1,4,5,7,8,11],['1','♭2','3','4','5','♭6','7'],'♭2と♭6を含む中東・東欧的な音階。'],['民族・エキゾチック','スパニッシュ8ノート',[0,1,3,4,5,6,8,10],['1','♭2','♭3','3','4','♭5','♭6','♭7'],'フラメンコ的な半音進行を持つ8音音階。'],['民族・エキゾチック','アラビックスケール',[0,2,4,5,6,8,10],['1','2','3','4','♭5','♭6','♭7'],'乾いた異国感を作る音階。'],['民族・エキゾチック','ペルシアンスケール',[0,1,4,5,6,8,11],['1','♭2','3','4','♭5','♭6','7'],'♭2・♭5・♭6が緊張感を作る音階。'],['民族・エキゾチック','エニグマティック',[0,1,4,6,8,10,11],['1','♭2','3','#4','♭6','♭7','7'],'謎めいた人工音階。'],['民族・エキゾチック','プロメテウス',[0,2,4,6,9,10],['1','2','3','#4','6','♭7'],'浮遊感と明るい不協和を持つ6音音階。'],['日本音階','インセンス',[0,1,5,7,10],['1','♭2','4','5','♭7'],'静かで余白の多い五音音階。'],['日本音階','岩戸',[0,1,5,6,10],['1','♭2','4','♭5','♭7'],'半音の緊張感と空虚な響きを持つ日本的五音音階。']];function inject(d){for(const k of Object.keys(d)){let r=chrom.indexOf(k);if(r<0)continue;for(const [g,n,it,deg,desc] of extras){d[k][g]??={};d[k][g][n]??=it.map((v,i)=>({degree:deg[i]+'度',name:chrom[(r+v)%12],description:desc+'【音楽的アプローチ】特徴音を短く提示し、ルートかコードトーンへ解決する。'}))}}}const profiles=[[/ビバップ/i,{r:[4,4,4,2],m:'ジャズ・クロマチック',c:'7、m7、maj7',a:'追加音を経過音として使い、コードトーンを強拍に置く。',v:'追加音に長く止まらない。',p:['IIm7 → V7 → Imaj7','V7 → Imaj7'],s:'ビバップ、ハードバップ。',t:'7音音階に経過音を加えた8音音階。'}],[/ハンガリアン|ダブルハーモニック|アラビック|ペルシアン|スパニッシュ/i,{r:[4,4,3,2],m:'異国的・劇的・緊張感',c:'m、7(b9)、sus(b9)、ドローン',a:'増2度を印象的に使いルートへ戻す。',v:'特徴音を同時に鳴らしすぎない。',p:['Iを持続 → ♭II → I','Im → ♭II → V'],s:'民族音楽、劇伴、メタル。',t:'半音と増2度が異国感を作る。'}],[/インセンス|岩戸|都節|琉球/i,{r:[3,4,3,3],m:'和風・静寂・余白',c:'sus、5、m(add9)、ドローン',a:'余韻と休符を活かす。',v:'機能和声を強く付けすぎない。',p:['I5を持続','I → ♭II → I'],s:'和風劇伴、民謡、アンビエント。',t:'少ない音で強い情景を作れる。'}],[/ドリアン/i,{r:[3,5,4,3],m:'都会的・ファンク・ジャズ',c:'m7、m6、m9',a:'長6度を特徴音として伸ばす。',v:'6度を使わないと普通のマイナーに聞こえる。',p:['Im7 → IV7','Im7 → ♭VIImaj7'],s:'モードジャズ、ファンク。',t:'メジャー第2モード。'}],[/ブルース/i,{r:[2,5,5,5],m:'泥臭い・感情的・ロック',c:'7、m7',a:'ブルーノートを経過音にする。',v:'安定音へ解決する。',p:['I7 → IV7 → I7 → V7'],s:'ブルース、ロック。',t:'メジャーとマイナー感を含む。'}],[/ペンタ/i,{r:[1,5,5,5],m:'親しみやすい・万能',c:'メジャー／マイナー系',a:'短いモチーフを反復する。',v:'同じ運指だけだと単調。',p:['I → IV → V'],s:'ポップス、ロック、民謡。',t:'世界各地で見られる5音音階。'}],[/マイナー/i,{r:[2,5,5,5],m:'切ない・哀愁',c:'m、m7、m9',a:'♭3・♭6・♭7を意識する。',v:'♭6を長く伸ばしすぎない。',p:['Im → ♭VI → ♭III → ♭VII'],s:'バラード、ロック。',t:'メジャー第6モード。'}],[/メジャー/i,{r:[1,5,5,5],m:'明るい・安定',c:'maj7、6、add9',a:'1・3・5度へ着地する。',v:'4度を長く伸ばしすぎない。',p:['I → IV → V → I'],s:'ポップス、ロック。',t:'西洋音楽の基準音階。'}]];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function flatten(){flat=[];for(const [key,gs] of Object.entries(data))for(const [group,ss] of Object.entries(gs))for(const [name,arr] of Object.entries(ss))flat.push({key,group,name,arr,desc:arr?.[0]?.description||'',alias:aliases[name]||[]})}function profile(x){for(const [r,p] of profiles)if(r.test(x.name+' '+x.group))return p;return{r:[3,3,2,3],m:'個性的・実験的',c:'ドローン、sus、5',a:'特徴音からルートへ解決する。',v:'詰め込みすぎない。',p:['Iを持続 → 特徴音'],s:'劇伴、ゲーム音楽。',t:'響きそのものを活かす。'}}function stars(n){return'★'.repeat(n)+'☆'.repeat(5-n)}function opts(e,a,l=x=>x){e.innerHTML=a.map(x=>`<option value="${esc(x)}">${esc(l(x))}</option>`).join('')}function bindKey(){opts($('#group'),Object.keys(data[$('#key').value]||{}));bindGroup()}function bindGroup(){opts($('#scale'),Object.keys(data[$('#key').value]?.[$('#group').value]||{}));show()}function obj(){return flat.find(x=>x.key===$('#key').value&&x.group===$('#group').value&&x.name===$('#scale').value)}function id(x){return`${x.key}|${x.group}|${x.name}`}function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function show(){current=obj();if(!current)return;const p=profile(current),ns=current.arr.map(v=>v.name),ds=current.arr.map(v=>v.degree),f=Math.min(ns.length-1,Math.max(1,ns.length===5?3:2));$('#groupLabel').textContent=current.group;$('#title').textContent=`${current.key} ${current.name}`;$('#aliases').textContent=current.alias.length?'別名: '+current.alias.join(' / '):'別名登録なし';$('#notes').innerHTML=ns.map((n,i)=>`<div class="note ${i===0?'root':''} ${i===f?'feature':''}">${n}</div>`).join('');$('#degrees').innerHTML=ds.map(d=>`<div class="degree">${d}</div>`).join('');let parts=current.desc.split('【音楽的アプローチ】');$('#description').textContent=parts[0];$('#feature').textContent=`${ns[f]}（${ds[f]}）`;$('#chords').textContent=current.key+p.c;$('#aliasInfo').textContent=current.alias.length?current.alias.join(' / '):'独立名称';$('#related').textContent='同主調・平行調・ペンタトニックと比較すると理解しやすい。';$('#approach').textContent=parts[1]||p.a;$('#avoid').textContent=p.v;$('#mood').textContent=p.m;$('#song').textContent=p.s;$('#trivia').textContent=p.t;$('#link').textContent=`${current.key}をルートにした ${p.c} をコード辞典で確認できる。`;['difficulty','recommend','usage','beginner'].forEach((k,i)=>$('#'+k).textContent=stars(p.r[i]));$('#progressions').innerHTML=p.p.map(v=>`<div class="progression">${v}</div>`).join('');let ph=[ns.slice(0,5),[ns[0],ns[Math.min(2,ns.length-1)],ns[1],ns[Math.min(3,ns.length-1)],ns[0]]];$('#phrases').innerHTML=ph.map((a,i)=>`<div class="phrase"><code>${a.join(' - ')}</code><button class="btn" data-phrase="${i}">▶ 再生</button></div>`).join('');$$('[data-phrase]').forEach(b=>b.onclick=()=>playNotes(ph[+b.dataset.phrase]));updateFav();history();renderLists();fillCompare()}function toggleFav(){let a=load(F),v=id(current);a=a.includes(v)?a.filter(x=>x!==v):[v,...a].slice(0,40);save(F,a);updateFav();renderLists()}function updateFav(){let on=load(F).includes(id(current));$('#fav').classList.toggle('on',on);$('#fav').textContent=on?'♥ お気に入り済み':'♡ お気に入り'}function history(){let a=load(H).filter(x=>x!==id(current));a.unshift(id(current));save(H,a.slice(0,12))}function renderList(el,a){el.innerHTML=a.map(v=>flat.find(x=>id(x)===v)).filter(Boolean).map(x=>`<button class="mini" data-id="${id(x)}"><b>${x.key} ${x.name}</b><span>${x.group}</span></button>`).join('')||'<p class="empty">まだありません</p>';el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let x=flat.find(x=>id(x)===b.dataset.id);$('#key').value=x.key;bindKey();$('#group').value=x.group;bindGroup();$('#scale').value=x.name;show()})}function renderLists(){renderList($('#favorites'),load(F));renderList($('#history'),load(H))}function fillCompare(){let a=flat.filter(x=>x.key===current.key&&id(x)!==id(current));opts($('#compare'),a,id);compare()}function compare(){let b=flat.find(x=>id(x)===$('#compare').value);if(!b)return;let A=new Set(current.arr.map(x=>x.name)),B=new Set(b.arr.map(x=>x.name)),panel=(x,o)=>`<div class="box"><b>${x.key} ${x.name}</b><p>${x.arr.map(n=>`<span class="${o.has(n.name)?'':'diff'}">${n.name}</span>`).join(' · ')}</p></div>`;$('#compareGrid').innerHTML=panel(current,B)+panel(b,A)}function pc(n){return chrom.indexOf(String(n).replace(/[^A-G#]/g,''))}function playNotes(ns){let C=window.AudioContext||window.webkitAudioContext,ctx=new C(),gap=+$('#tempo').value
