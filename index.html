<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Tber スケール辞典</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{font-family:sans-serif;background:#eef3f8;margin:0;padding:2rem;text-align:center}
    h1{margin-bottom:1rem}
    select{font-size:1.1rem;margin:.5rem;padding:.4rem .6rem}
    table{margin:1.5rem auto;border-collapse:collapse}
    th,td{border:1px solid #bbb;padding:.5rem 1rem;background:#fff}
    #description{max-width:800px;margin:1.5rem auto;font-size:1rem;line-height:1.5}
    .topbar{display:flex;align-items:center;justify-content:center;position:relative;max-width:900px;margin:0 auto 1rem;min-height:44px}
    .menu-button{position:absolute;left:0;display:grid;place-items:center;width:42px;height:42px;padding:0;border:1px solid rgba(0,0,0,.12);border-radius:12px;background:#fff;color:#1f2937;font-size:1.35rem;cursor:pointer}
    .quick-switch{position:absolute;right:0;display:flex;align-items:center;gap:7px;min-height:42px;padding:0 14px;border:1px solid rgba(0,0,0,.12);border-radius:12px;background:#fff;color:#1f2937;text-decoration:none;font-size:.9rem;font-weight:700;box-sizing:border-box}
    .quick-switch:active{transform:scale(.98)}
    .menu-overlay{position:fixed;inset:0;z-index:80;background:rgba(17,24,39,.35);opacity:0;pointer-events:none;transition:opacity .2s ease}
    .menu-overlay.open{opacity:1;pointer-events:auto}
    .side-menu{position:fixed;top:0;left:0;z-index:90;width:min(82vw,300px);height:100%;padding:24px 18px;background:#fff;box-shadow:14px 0 34px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .22s ease;text-align:left;box-sizing:border-box}
    .side-menu.open{transform:translateX(0)}
    .side-menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .side-menu-head h2{margin:0;font-size:1.15rem}
    .menu-close{width:36px;height:36px;border:0;border-radius:10px;background:#f1f1f1;font-size:1.3rem}
    .menu-link{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;margin-bottom:8px;border:0;border-radius:12px;color:#1f2937;background:transparent;text-decoration:none;font-weight:700;box-sizing:border-box}
    .menu-link:hover,.menu-link:focus{background:#eef3f8}
    .menu-link.current{background:#dfeaf5}
    .menu-icon{width:28px;text-align:center;font-size:1.15rem}
    @media(max-width:680px){body{padding:1rem}.topbar{justify-content:center;padding:0 52px}.topbar h1{font-size:1.25rem;line-height:1.25}.menu-button{width:38px;height:38px}.quick-switch{min-height:38px;width:38px;padding:0;justify-content:center;font-size:0}.quick-switch span:first-child{font-size:1.1rem}}
  </style>
</head>
<body>
  <div id="menuOverlay" class="menu-overlay"></div>
  <nav id="sideMenu" class="side-menu" aria-hidden="true" aria-label="サイトメニュー">
    <div class="side-menu-head"><h2>メニュー</h2><button id="menuCloseBtn" class="menu-close" type="button" aria-label="メニューを閉じる">×</button></div>
    <a class="menu-link" href="https://akito0802.github.io/NEET-note/"><span class="menu-icon">📝</span><span>NEET NOTE</span></a>
    <a class="menu-link current" href="./"><span class="menu-icon">🎸</span><span>Scale</span></a>
  </nav>

  <div class="topbar">
    <button id="menuOpenBtn" class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false">☰</button>
    <h1>Tber スケール辞典</h1>
    <a class="quick-switch" href="https://akito0802.github.io/NEET-note/" aria-label="NEET NOTEへ移動"><span>📝</span><span>NEET NOTE</span></a>
  </div>
  <div>
    <select id="keySelect"></select>
    <select id="groupSelect"></select>
    <select id="scaleSelect"></select>
  </div>

  <table id="scaleTable"></table>
  <div id="description"></div>

<script>
let scaleData = {};
const keySelect = document.getElementById("keySelect");
const groupSelect = document.getElementById("groupSelect");
const scaleSelect = document.getElementById("scaleSelect");

const menuOpenBtn=document.getElementById("menuOpenBtn");
const menuCloseBtn=document.getElementById("menuCloseBtn");
const sideMenu=document.getElementById("sideMenu");
const menuOverlay=document.getElementById("menuOverlay");
function openMenu(){sideMenu.classList.add("open");menuOverlay.classList.add("open");sideMenu.setAttribute("aria-hidden","false");menuOpenBtn.setAttribute("aria-expanded","true");document.body.style.overflow="hidden"}
function closeMenu(){sideMenu.classList.remove("open");menuOverlay.classList.remove("open");sideMenu.setAttribute("aria-hidden","true");menuOpenBtn.setAttribute("aria-expanded","false");document.body.style.overflow=""}
menuOpenBtn.addEventListener("click",openMenu);
menuCloseBtn.addEventListener("click",closeMenu);
menuOverlay.addEventListener("click",closeMenu);
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeMenu()});

fetch("scales.json")
  .then(r => r.json())
  .then(d => { scaleData = d; initUI(); });

function initUI(){
  Object.keys(scaleData).forEach(k=>{
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = k;
    keySelect.appendChild(opt);
  });
  keySelect.addEventListener("change", handleKeyChange);
  groupSelect.addEventListener("change", handleGroupChange);
  scaleSelect.addEventListener("change", showScale);
  handleKeyChange();
}

function handleKeyChange(){
  const key = keySelect.value;
  const prevGroup = groupSelect.value;
  populateGroups(key, prevGroup);
}

function handleGroupChange(){
  const key = keySelect.value;
  const prevScale = scaleSelect.value;
  populateScales(key, groupSelect.value, prevScale);
}

function populateGroups(key, selectedGroup){
  const groups = Object.keys(scaleData[key]);
  groupSelect.innerHTML = "";
  groups.forEach(g=>{
    const opt = document.createElement("option");
    opt.value = g;
    opt.textContent = g;
    groupSelect.appendChild(opt);
  });
  if(selectedGroup && groups.includes(selectedGroup)){
    groupSelect.value = selectedGroup;
  }
  populateScales(key, groupSelect.value);
}

function populateScales(key, group, selectedScale){
  const scales = Object.keys(scaleData[key][group]);
  scaleSelect.innerHTML = "";
  scales.forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    scaleSelect.appendChild(opt);
  });
  if(selectedScale && scales.includes(selectedScale)){
    scaleSelect.value = selectedScale;
  }
  showScale();
}

function showScale(){
  const key   = keySelect.value;
  const group = groupSelect.value;
  const scaleName = scaleSelect.value;
  const tbl = document.getElementById("scaleTable");
  const descDiv = document.getElementById("description");

  if(!(scaleData[key] && scaleData[key][group] && scaleData[key][group][scaleName])){
    tbl.innerHTML = "";
    descDiv.textContent = "";
    return;
  }
  const arr = scaleData[key][group][scaleName];
  const degrees = arr.map(o=>o.degree || "");
  const notes   = arr.map(o=>o.name || "");
  const description = (arr[0] && arr[0].description) || "";
  tbl.innerHTML = "<tr>" + degrees.map(d=>`<th>${d}</th>`).join("") + "</tr>" +
                  "<tr>" + notes.map(n=>`<td>${n}</td>`).join("") + "</tr>";
  descDiv.textContent = description;
}
</script>
</body>
</html>
