<style>
:root{--bg:#eef3f8;--panel:#fff;--panel2:#f7fafc;--ink:#172033;--muted:#64748b;--line:#d8e1eb;--accent:#6d5bd0;--accent2:#ece9ff;--root:#ef476f;--feature:#f59e0b;--shadow:0 10px 28px rgba(30,41,59,.08)}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;transition:.2s}.shell{max-width:920px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}.title{flex:1}.title p{margin:0;color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.1em}.title h1{margin:2px 0 0;font-size:1.65rem}button,select{font:inherit}.icon-btn,.menu-close{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer}.theme-top{padding:0 14px;width:auto;font-weight:800}.menu-overlay{position:fixed;inset:0;z-index:98;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s}.menu-overlay.open{opacity:1;pointer-events:auto}.side-menu{position:fixed;inset:0 auto 0 0;z-index:99;width:min(84vw,310px);padding:22px 18px;background:var(--panel);transform:translateX(-105%);transition:.22s;box-shadow:20px 0 40px rgba(0,0,0,.22)}.side-menu.open{transform:none}.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.side-head h2{margin:0}.menu-link,.theme-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;margin:7px 0;border:0;border-radius:12px;background:transparent;color:var(--ink);text-decoration:none;font-weight:800;text-align:left}.menu-link:hover,.menu-link.current,.theme-toggle:hover{background:var(--accent2)}
.card,details{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}.card{padding:20px}.filters{padding:20px}.filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.filter-grid select,.compare-select select,#tempo{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:0 12px}.hero-head{display:flex;gap:12px;align-items:flex-start}.hero-head>div{flex:1}.eyebrow{margin:0;color:var(--accent);font-size:.75rem;font-weight:900;letter-spacing:.1em}.hero h2{margin:4px 0;font-size:1.8rem}.subtitle{margin:0;color:var(--muted)}.fav{height:40px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--ink);padding:0 14px;font-weight:800}.fav.on{background:#fff4cc;color:#7c5600}.note-row,.degree-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px;margin-top:16px}.note,.degree{height:48px;display:grid;place-items:center;border-radius:12px}.note{background:var(--panel2);border:1px solid var(--line);font-weight:900}.note.root{background:var(--root);border-color:var(--root);color:#fff}.note.feature{outline:3px solid color-mix(in srgb,var(--feature) 55%,transparent)}.degree{height:24px;color:var(--muted);font-size:.82rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{min-height:42px;border:0;border-radius:12px;padding:0 14px;background:var(--accent);color:#fff;font-weight:850;cursor:pointer}.btn.sub{background:var(--accent2);color:var(--ink)}
summary{display:flex;align-items:center;gap:10px;padding:18px 20px;font-weight:900;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'＋';margin-left:auto;color:var(--accent);font-size:1.2rem}details[open] summary::after{content:'−'}details[open] summary{border-bottom:1px solid var(--line)}.detail-body{padding:18px 20px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.info{min-height:132px;padding:16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.info.wide{grid-column:1/-1}.info b{display:block;margin-bottom:8px;font-size:.95rem}.info p{margin:0;color:var(--muted);line-height:1.65;font-size:.95rem}.rating-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.rating{padding:15px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.rating-head{display:flex;justify-content:space-between;gap:10px;font-weight:850}.stars{color:#f59e0b;letter-spacing:.08em}.progressions,.phrase-box,.related-list{display:grid;gap:9px}.progression,.phrase,.related{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink)}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px}.phrase code{font-size:1rem;word-break:break-word}.phrase button{flex:0 0 auto}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.compare-panel{min-height:150px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px}.compare-panel h3{margin:0 0 8px;font-size:1rem}.compare-panel p{line-height:1.8}.compare-panel small{color:var(--muted)}.diff{color:var(--feature);font-weight:900}.section-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.section-grid .card{margin:0;min-height:260px}.history-list{display:grid;gap:8px}.mini{min-height:64px;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:11px 12px;text-align:left;cursor:pointer}.mini b{display:block}.mini span{color:var(--muted);font-size:.82rem}.empty{color:var(--muted)}
@media(max-width:760px){.shell{padding:12px}.title h1{font-size:1.35rem}.theme-top{width:42px;font-size:0}.theme-top::before{content:'◐';font-size:1rem}.filter-grid,.info-grid,.rating-grid,.compare-grid,.section-grid{grid-template-columns:1fr}.card{padding:16px}.info{min-height:0}.info.wide{grid-column:auto}.section-grid .card{min-height:0}.hero-head{align-items:center}.hero h2{font-size:1.5rem}summary,.detail-body{padding-left:16px;padding-right:16px}}
</style>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data={},current=null,flat=[];const LS_THEME='neet-note-theme',LS_FAV='scale-favorites-v2',LS_HIST='scale-history-v2';const norm=s=>String(s||'').toLowerCase();
function infer(name,desc){const t=norm(name+' '+desc),m=[],g=[];if(/major|メジャー|ionian/.test(t))m.push('明るい');if(/minor|マイナー|aeolian/.test(t))m.push('切ない');if(/dimin|altered|locrian|オルタード/.test(t))m.push('不穏');if(/whole|lydian|リディアン/.test(t))m.push('幻想的');if(/japanese|都節|平調子|ヨナ抜き|琉球/.test(t))m.push('和風');if(/dorian|mixolydian|ドリアン|ミクソ/.test(t))m.push('おしゃれ');if(/phrygian|harmonic|フリジアン/.test(t))m.push('激しい');if(/pentatonic|ペンタ/.test(t))g.push('ロック','ポップス');if(/blues|ブルース/.test(t))g.push('ブルース','ロック');if(/jazz|bebop|altered|lydian dominant|ジャズ/.test(t))g.push('ジャズ');if(/phrygian|harmonic minor/.test(t))g.push('メタル');if(/japanese|arab|spanish|gypsy|都節|琉球/.test(t))g.push('民族音楽','ゲーム音楽');if(!g.length)g.push('ポップス');return{moods:[...new Set(m)],genres:[...new Set(g)]}}
function flatten(){flat=[];Object.entries(data).forEach(([key,groups])=>Object.entries(groups).forEach(([group,scales])=>Object.entries(scales).forEach(([name,arr])=>{const desc=arr?.[0]?.description||'';flat.push({key,group,name,arr,desc,...infer(name,desc)})})))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function options(el,arr){el.innerHTML=arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function theme(v){document.documentElement.dataset.theme=v;localStorage.setItem(LS_THEME,v);const d=v==='dark';$('#themeTop').textContent=d?'☀️ ライト':'🌙 ダーク';$('#themeMenu').textContent=d?'☀️ ライトモード':'🌙 ダークモード';document.querySelector('meta[name=theme-color]').content=d?'#111827':'#eef3f8'}function setupMenu(){const m=$('#sideMenu'),o=$('#menuOverlay');$('#menuOpen').onclick=()=>{m.classList.add('open');o.classList.add('open')};const close=()=>{m.classList.remove('open');o.classList.remove('open')};$('#menuClose').onclick=close;o.onclick=close;$('#themeTop').onclick=$('#themeMenu').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');theme(localStorage.getItem(LS_THEME)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}
function bindKey(){const k=$('#keySelect').value;options($('#groupSelect'),Object.keys(data[k]||{}));bindGroup()}function bindGroup(){const k=$('#keySelect').value,g=$('#groupSelect').value;options($('#scaleSelect'),Object.keys(data[k]?.[g]||{}));showSelected()}function currentObj(){return flat.find(x=>x.key===$('#keySelect').value&&x.group===$('#groupSelect').value&&x.name===$('#scaleSelect').value)}function go(x){$('#keySelect').value=x.key;bindKey();$('#groupSelect').value=x.group;bindGroup();$('#scaleSelect').value=x.name;showSelected();scrollTo({top:0,behavior:'smooth'})}
function kind(x){const n=norm(x.name);if(/altered|オルタード/.test(n))return'altered';if(/dorian|ドリアン/.test(n))return'dorian';if(/phrygian|フリジアン/.test(n))return'phrygian';if(/lydian|リディアン/.test(n))return'lydian';if(/mixolydian|ミクソ/.test(n))return'mixolydian';if(/locrian|ロクリアン/.test(n))return'locrian';if(/harmonic|ハーモニック/.test(n))return'harmonic';if(/melodic|メロディック/.test(n))return'melodic';if(/pentatonic|ペンタ/.test(n))return'pentatonic';if(/blues|ブルース/.test(n))return'blues';if(/whole|ホールトーン/.test(n))return'whole';if(/dimin|ディミニッシュ/.test(n))return'diminished';if(x.moods.includes('和風'))return'japanese';if(/minor|マイナー|aeolian/.test(n))return'minor';if(/major|メジャー|ionian/.test(n))return'major';return'other'}
const presets={major:{rating:[1,5,5,5],caution:'4度をメジャーコード上で長く伸ばすと3度とぶつかりやすい。経過音として扱うと自然。',avoid:'4度はメジャー系コード上で注意。短く通過させるか3度へ解決する。',progress:['Imaj7 → IVmaj7 → V7 → Imaj7','I → V → vi → IV'],song:'王道ポップス、明るい映画主題歌、爽やかなロック。',trivia:'西洋音楽の基準となる音階で、ダイアトニックコードの土台。'},minor:{rating:[2,5,5,5],caution:'♭6を強く伸ばし続けると暗さが強くなる。狙う場面を決めて使う。',avoid:'コードによって6度が濁る場合があるため、着地点はルート・♭3・5度が安全。',progress:['i → ♭VI → ♭III → ♭VII','i → iv → v → i'],song:'切ないバラード、哀愁のあるロック、ダークな劇伴。',trivia:'自然短音階はメジャースケールの第6モードにあたる。'},dorian:{rating:[3,5,4,3],caution:'ナチュラル6度を出さないと普通のマイナーに聞こえやすい。',avoid:'大きなアヴォイドは少ないが、6度を特徴音として意識する。',progress:['i7 → IV7','i7 → ♭VIImaj7'],song:'ジャズファンク、モーダルジャズ、都会的なマイナーグルーヴ。',trivia:'マイナーなのに6度が明るいため、暗さと爽やかさを両立できる。'},phrygian:{rating:[4,3,2,2],caution:'♭2を長く止めると不安定さが強い。ルートへ半音解決するとまとまる。',avoid:'♭2は強烈な緊張音。コードトーンへの解決を前提に使う。',progress:['i → ♭II','i → ♭II → ♭VII → i'],song:'フラメンコ風、メタル、異国感のあるゲーム音楽。',trivia:'ルートと♭2の半音関係が最も分かりやすい個性。'},lydian:{rating:[3,5,3,3],caution:'♯4を多用しすぎると落ち着きがなくなる。長音と経過音を使い分ける。',avoid:'大きなアヴォイドは少ない。♯4を特徴音として意図的に扱う。',progress:['Imaj7(#11) → II','Imaj7 → II/I'],song:'幻想的な映画音楽、浮遊感のあるポップス、ゲームの空中ステージ。',trivia:'メジャー系モードの中でも特に浮遊感が強い。'},mixolydian:{rating:[2,5,5,4],caution:'メジャー7度を混ぜるとキャラクターが曖昧になる。♭7を軸にする。',avoid:'4度は3度を含むドミナントコード上で注意。',progress:['I7 → ♭VII','I7 → IV7'],song:'ブルースロック、ファンク、陽気なルーツ系音楽。',trivia:'ドミナント7thコードと相性が良く、ロックでも頻出。'},locrian:{rating:[5,2,1,1],caution:'♭5のため主和音が不安定。長く停滞させず緊張場面に限定すると扱いやすい。',avoid:'♭2・♭5は強い緊張音。短く使いコードトーンへ解決する。',progress:['iø7 → ♭IImaj7','iiø7 → V7 → i'],song:'不穏な劇伴、サスペンス、現代的なジャズ。',trivia:'メジャースケールの第7モードで、唯一トニックが減5度を含む。'},pentatonic:{rating:[1,5,5,5],caution:'音が安全な分、同じ形の反復だけだと単調になりやすい。リズムで変化をつける。',avoid:'基本的に大きなアヴォイドは少ない。',progress:['I → IV → V','i → ♭VII → ♭VI'],song:'ロック、ポップス、民謡、ギターソロ全般。',trivia:'5音に絞ることで濁りが少なく、世界各地の音楽に見られる。'},blues:{rating:[2,5,5,5],caution:'ブルーノートを長く固定すると濁りやすい。チョーキングや経過音として扱う。',avoid:'ブルーノートは安定音ではないため、半音上または下へ解決する。',progress:['I7 → IV7 → I7 → V7','I7 → IV7 → V7 → IV7'],song:'ブルース、ロックンロール、ファンク、ソウル。',trivia:'メジャーとマイナーの感覚を同時に含む独特な音階。'},altered:{rating:[5,4,2,1],caution:'解決先がない場面では濁りが強すぎる。V7からIへの解決で使う。',avoid:'ほぼ全てがテンション。長く止めずコードトーンへ半音解決する。',progress:['V7alt → i','iiø7 → V7alt → i'],song:'緊張感の強いジャズ、現代的なドミナント処理。',trivia:'メロディックマイナーの第7モードとして説明されることが多い。'},harmonic:{rating:[4,4,3,2],caution:'増2度の響きが強いので、曲調と合わないと異国感が出すぎる。',avoid:'♭6はコードによって濁りやすい。導音からルートへの解決を優先。',progress:['i → iv → V7 → i','i → ♭VI → V7 → i'],song:'クラシカルメタル、中東風、劇的なマイナー曲。',trivia:'短調で強い属和音を作るため7度を半音上げた音階。'},melodic:{rating:[5,4,3,2],caution:'コードごとに使い分けないと響きが曖昧になる。',avoid:'対応コードにより注意音が変わるため、コードトーンを着地点にする。',progress:['iMaj7 → ii7','ii7 → V7alt → iMaj7'],song:'モダンジャズ、フュージョン、洗練されたマイナー曲。',trivia:'ジャズでは上行・下行を同じ音列として扱うことが多い。'},whole:{rating:[4,3,2,2],caution:'半音の解決感がないため、長く続けると調性感が薄くなる。',avoid:'全てが対称的なため、明確な着地点を別に用意する。',progress:['V7#5 → I','V+ → ♭VII+ → I'],song:'夢、無重力、曖昧な場面の劇伴。',trivia:'全音だけで構成され、移調しても同じ形が繰り返される。'},diminished:{rating:[5,3,2,1],caution:'機械的に聞こえやすいので、最後は半音でコードトーンへ解決する。',avoid:'長く停滞させず、ドミナント上の経過的な緊張として使う。',progress:['V7♭9 → i','I°7 → ii7 → V7'],song:'サスペンス、ジャズの緊張場面、クラシカルなパッセージ。',trivia:'短3度ごとに同じ構造が現れる対称音階。'},japanese:{rating:[2,4,2,4],caution:'音を詰め込みすぎると和風の余白が消える。休符と長音を活かす。',avoid:'大きなアヴォイドより、音数を絞ることが重要。',progress:['i → ♭II → i','i → ♭VII → i'],song:'和風ゲーム音楽、時代劇、静かな民族調の楽曲。',trivia:'日本の伝統音楽では旋律型や楽器によって複数の音階が使い分けられる。'},other:{rating:[3,3,2,3],caution:'特徴音を一度に詰め込みすぎず、短いモチーフで響きを確認する。',avoid:'コードトーンを着地点にすれば大きく外れにくい。',progress:['I → IV → V → I'],song:'実験的なポップス、劇伴、ジャンル横断的な楽曲。',trivia:'名称や分類より、特徴音と解決感を耳で覚えるのが実践的。'}};
function profile(x){return presets[kind(x)]||presets.other}function stars(n){return'★'.repeat(n)+'☆'.repeat(5-n)}
function chordsFor(x){const k=kind(x);if(k==='altered')return`${x.key}7alt、${x.key}7♭9、${x.key}7♯9`;if(k==='dorian')return`${x.key}m7、${x.key}m6`;if(k==='mixolydian')return`${x.key}7、${x.key}9`;if(k==='lydian')return`${x.key}maj7(#11)`;if(k==='minor'||k==='harmonic'||k==='melodic')return`${x.key}m、${x.key}m7、${x.key}mMaj7`;if(k==='blues')return`${x.key}7、${x.key}ブルース進行`;return`${x.key}、${x.key}maj7、${x.key}6`}
function parentFor(x){const n=norm(x.name),map=[['dorian','メジャースケールの第2モード'],['phrygian','メジャースケールの第3モード'],['lydian','メジャースケールの第4モード'],['mixolydian','メジャースケールの第5モード'],['aeolian','メジャースケールの第6モード'],['locrian','メジャースケールの第7モード']],h=map.find(([k])=>n.includes(k));return h?h[1]:'同主調・平行調と比較すると理解しやすい。'}
function approachFor(x){const k=kind(x),key=x.key;const m={altered:`${key}7系コード上で♭9・♯9・♭13を緊張音として使い、半音で次のコードトーンへ解決する。`,dorian:`${key}m7を中心に6度を長めに響かせ、短いモチーフを反復する。`,phrygian:'♭2を短く強調し、ルートへ半音解決する。低音のペダルと組み合わせる。',lydian:`${key}maj7上で♯4を伸ばし、3度や5度へ滑らかにつなぐ。`,mixolydian:`${key}7上で♭7を軸にし、メジャー3度との対比を作る。`,locrian:'♭2と♭5を経過音として使い、ルートや♭3へ解決する。',harmonic:'増2度の跳躍と導音からルートへの解決を意識する。',melodic:'コードトーンを強拍に置き、6度・7度を滑らかな経過音として使う。',pentatonic:'短いモチーフを反復し、リズム・休符・奏法で変化をつける。',blues:'ブルーノートを経過音として使い、チョーキングや休符で表情をつける。',whole:'同じ形を全音ずつ移動させ、最後にコードトーンへ着地する。',diminished:'短3度ごとの同型フレーズを移動させ、半音でコードトーンへ解決する。',japanese:'主音を長く保ち、2〜3音の動機と余白を活かす。',minor:`${key}m系コード上で♭3・♭6・♭7を意識し、ルートか5度へ着地する。`,major:`${key}maj系コード上で1・3・5度を着地点にし、2・6度を経過音として使う。`,other:'特徴音を一度強調したあと、ルートまたはコードトーンへ解決する。'};return m[k]||m.other}
function relatedScales(x){const k=kind(x),key=x.key;const map={major:[`${key}メジャーペンタ`,`${key}リディアン`,`${key}ミクソリディアン`],minor:[`${key}マイナーペンタ`,`${key}ドリアン`,`${key}ハーモニックマイナー`],mixolydian:[`${key}ブルース`,`${key}メジャーペンタ`,`${key}オルタード`],dorian:[`${key}マイナーペンタ`,`${key}ナチュラルマイナー`],altered:[`${key}ホールトーン`,`${key}ディミニッシュ`],blues:[`${key}マイナーペンタ`,`${key}ミクソリディアン`]};return(map[k]||[`${key}ペンタトニック`,`同主調のメジャー／マイナー`]).join('、')}
function phraseFor(x){const ns=x.arr.map(v=>v.name).filter(Boolean);if(!ns.length)return[];const a=ns.slice(0,Math.min(5,ns.length));const b=[ns[0],ns[Math.min(2,ns.length-1)],ns[Math.min(1,ns.length-1)],ns[Math.min(3,ns.length-1)],ns[0]];return[a,b].map(v=>v.join(' - '))}
function renderPhrases(x){const list=phraseFor(x);$('#phrases').innerHTML=list.map((p,i)=>`<div class="phrase"><code>${esc(p)}</code><button class="btn sub" data-phrase="${i}">▶ 再生</button></div>`).join('');$$('[data-phrase]').forEach(b=>b.onclick=()=>playNotes(list[+b.dataset.phrase].split(' - ')))}
function showSelected(){current=currentObj();if(!current)return;const n=current.arr.map(x=>x.name||''),d=current.arr.map(x=>x.degree||''),f=Math.max(1,n.length>4?3:1),p=profile(current);$('#groupLabel').textContent=current.group;$('#scaleTitle').textContent=`${current.key} ${current.name}`;$('#scaleSubtitle').textContent=current.moods.concat(current.genres).slice(0,4).join('・');$('#notes').innerHTML=n.map((x,i)=>`<div class="note ${i===0?'root':''} ${i===f?'feature':''}">${esc(x)}</div>`).join('');$('#degrees').innerHTML=d.map(x=>`<div class="degree">${esc(x)}</div>`).join('');$('#description').textContent=(current.desc||'構成音を鳴らしながら、このスケールの響きを確認しよう。').replace(/【音楽的アプローチ】.*$/,'').trim();$('#featureText').textContent=n[f]?`${n[f]}（${d[f]||'特徴音'}）を意識すると個性が出やすい。`:'ルート音との距離感を意識しよう。';$('#chordText').textContent=chordsFor(current);$('#parentText').textContent=parentFor(current);$('#genreText').textContent=current.genres.join('・')||'幅広いジャンル';$('#cautionText').textContent=p.caution;$('#avoidText').textContent=p.avoid;$('#approachText').textContent=approachFor(current);$('#relatedScaleText').textContent=relatedScales(current);$('#songLikeText').textContent=p.song;$('#triviaText').textContent=p.trivia;['difficulty','recommend','usage','beginner'].forEach((id,i)=>$('#'+id+'Stars').textContent=stars(p.rating[i]));$('#progressions').innerHTML=p.progress.map(v=>`<div class="progression">${esc(v)}</div>`).join('');renderPhrases(current);updateFav();fillCompare();addHistory();renderSide()}
function id(x){return`${x.key}|${x.group}|${x.name}`}function store(k,v){localStorage.setItem(k,JSON.stringify(v))}function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}function byId(v){return flat.find(x=>id(x)===v)}function toggleFav(){let a=load(LS_FAV),v=id(current);a=a.includes(v)?a.filter(x=>x!==v):[v,...a].slice(0,30);store(LS_FAV,a);updateFav();renderSide()}function updateFav(){const on=load(LS_FAV).includes(id(current));$('#favBtn').classList.toggle('on',on);$('#favBtn').textContent=on?'★ お気に入り済み':'☆ お気に入り'}function addHistory(){let a=load(LS_HIST).filter(x=>x!==id(current));a.unshift(id(current));store(LS_HIST,a.slice(0,10))}function renderList(el,arr){el.innerHTML=arr.map(byId).filter(Boolean).map(x=>`<button class="mini" data-open="${esc(id(x))}"><b>${esc(x.key)} ${esc(x.name)}</b><span>${esc(x.group)}</span></button>`).join('')||'<p class="empty">まだありません</p>';el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(byId(b.dataset.open)))}function renderSide(){renderList($('#favorites'),load(LS_FAV));renderList($('#history'),load(LS_HIST))}
const chrom=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],alias={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};function pc(n){return chrom.indexOf(alias[n]||String(n).replace(/[^A-G#b]/g,''))}function midi(n,oct=4){return 12*(oct+1)+pc(n)}function playNotes(ns){const ctx=new(AudioContext||webkitAudioContext)(),gap=+$('#tempo').value;ns.forEach((n,i)=>setTimeout(()=>{const o=ctx.createOscillator(),g=ctx.createGain(),f=440*Math.pow(2,(midi(n)-69)/12);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.42);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.45)},i*gap))}function play(mode){const ns=current.arr.map(x=>x.name).filter(Boolean),seq=mode==='down'?[...ns].reverse():mode==='both'?[...ns,...ns.slice(0,-1).reverse()]:mode==='random'?[...ns].sort(()=>Math.random()-.5):ns;playNotes(seq)}
function fillCompare(){const same=flat.filter(x=>x.key===current.key&&id(x)!==id(current));options($('#compareScale'),same.map(id));renderCompare()}function renderCompare(){const b=byId($('#compareScale').value)||flat.find(x=>x.key===current.key&&id(x)!==id(current));if(!b)return;const as=new Set(current.arr.map(x=>pc(x.name))),bs=new Set(b.arr.map(x=>pc(x.name))),panel=(x,other)=>`<div class="compare-panel"><h3>${esc(x.key)} ${esc(x.name)}</h3><p>${x.arr.map(n=>`<span class="${other.has(pc(n.name))?'':'diff'}">${esc(n.name)}</span>`).join(' · ')}</p><small>${esc((x.desc||'').replace(/【音楽的アプローチ】.*$/,'').trim())}</small></div>`;$('#compareGrid').innerHTML=panel(current,bs)+panel(b,as)}
function init(){options($('#keySelect'),Object.keys(data));bindKey();$('#keySelect').onchange=bindKey;$('#groupSelect').onchange=bindGroup;$('#scaleSelect').onchange=showSelected;$('#compareScale').onchange=renderCompare;$('#favBtn').onclick=toggleFav;$$('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));showSelected()}
setupMenu();fetch('scales.json?v=20260730-2').then(r=>r.json()).then(d=>{data=d;flatten();init()}).catch(()=>{$('#scaleTitle').textContent='データを読み込めませんでした'});
</script>
