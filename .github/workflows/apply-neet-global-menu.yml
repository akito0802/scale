name: Apply NEETNOTE global menu
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-neet-global-menu.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          global_tag='<script src="https://akito0802.github.io/NEET-note/global-menu.js?v=20260812-1"></script>'
          dedupe_tag='<script src="https://akito0802.github.io/NEET-note/menu-dedupe.js?v=20260812-1"></script>'
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              original=s
              if 'global-menu.js' not in s:
                  s=s.replace('</body>',global_tag+'\n</body>',1) if '</body>' in s else s+'\n'+global_tag+'\n'
              if 'menu-dedupe.js' not in s:
                  s=s.replace('</body>',dedupe_tag+'\n</body>',1) if '</body>' in s else s+'\n'+dedupe_tag+'\n'
              if s!=original:p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Keep one shared NEETNOTE hamburger menu"
          git push