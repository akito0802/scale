name: Apply NEETNOTE global menu
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-neet-global-menu.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          tag='<script src="https://akito0802.github.io/NEET-note/global-menu-v4.js?v=20260817-5"></script>'
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8'); original=s
              s=re.sub(r'neet-menu-ui\.js\?v=[^"\']+', 'neet-menu-ui.js?v=20260817-2', s)
              s=re.sub(r'<script[^>]+src=["\']https://akito0802\.github\.io/NEET-note/global-menu(?:-v4)?\.js\?v=[^"\']+["\'][^>]*></script>','',s)
              s=re.sub(r'<script[^>]+src=["\']https://akito0802\.github\.io/NEET-note/menu-dedupe\.js\?v=[^"\']+["\'][^>]*></script>','',s)
              s=s.replace('</body>',tag+'\n</body>',1) if '</body>' in s else s+'\n'+tag+'\n'
              if s!=original:p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Bust scale menu cache and unify left-top menu"
          git push